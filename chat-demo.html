.nc-preview-badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--inset2);border:1px dashed var(--t2);color:var(--t2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:5px;margin-left:6px}

/* The coach's own questions (ApprovalCard.jsx) drawn as approval cards: a
   command or diff block, and a text answer field, in the kit's tokens. */
.nc-code{margin:0;padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);font:13px/1.5 var(--mono);color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.nc-code-details{margin-top:6px}
.nc-code-details>summary{cursor:pointer;font-size:13px;color:var(--accent-text);width:fit-content}
.nc-code-details>.nc-code{margin-top:8px}
.nc-question{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.nc-question>legend{padding:0;margin-bottom:10px}
.nc-field{width:100%;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--inset);color:var(--text);font:inherit;font-size:14.5px;outline:none;transition:border-color .18s,box-shadow .18s}
.nc-field:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cx-approval{margin:10px 0}

/* An area layout's own after row can tint its icon (ActionCard AfterRow, ext.after). */
.nc-after .nc-after-ic--warn{color:var(--warn)}
/* announcements cards: ported from preview/action-cards/announcements.html (nc-x-* → nc-x-announcements-*). */
.nc-x-announcements-from{display:flex;align-items:center;gap:12px;min-width:0}
.nc-x-announcements-from .nc-av{margin:0;border:0;width:40px;height:40px;font-size:13.5px;flex:none}
.nc-x-announcements-from .nc-grow{min-width:0}
.nc-x-announcements-from .nc-grow b{display:block;font-size:14.5px;font-weight:620;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-x-announcements-from .nc-grow span{display:block;font-size:12.5px;color:var(--mute);line-height:1.3}
.nc-x-announcements-headline{font-size:18px;font-weight:650;letter-spacing:-.014em;line-height:1.3;margin:0}
.nc-x-announcements-stat .nc-stat-num small{margin-left:.36em}
.nc-x-announcements-weeklbl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.nc-x-announcements-weeklbl span{display:inline-flex;align-items:center;gap:6px}
.nc-x-announcements-weeklbl i{width:7px;height:7px;border-radius:50%;background:var(--app);flex:none}
.nc-x-announcements-days .nc-day{cursor:default}
.nc-x-announcements-days .nc-day:hover{background:transparent}
.nc-x-announcements-days .nc-day-load i.is-imp{background:var(--app,var(--accent))}
.nc-x-announcements-days .nc-day-load i.is-none{opacity:.35;width:30%}
.nc-x-announcements-bang{background:var(--warn-soft);color:var(--warn)}
@container chat (max-width:480px){
  .nc-x-announcements-weeklbl{flex-wrap:wrap}
}
/* assignments: styles for this area's card layouts. Use nc-x-assignments-* class names.
   Ported from the approved mockup (preview/action-cards/assignments.html), renamed. */

/* steps: the runway between today and the due date */
.nc-x-assignments-runway{display:grid;gap:4px}
.nc-x-assignments-rw{position:relative;text-align:center;font-size:11.5px;line-height:1.25;color:var(--mute);padding-top:32px;font-variant-numeric:tabular-nums}
.nc-x-assignments-rw::before{content:"";position:absolute;left:-2px;right:-2px;top:13.5px;height:3px;background:color-mix(in srgb,var(--app) 40%,var(--line2))}
.nc-x-assignments-rw:first-child::before{left:0;border-radius:3px 0 0 3px}
.nc-x-assignments-rw:last-child::before{right:0;border-radius:0 3px 3px 0}
.nc-x-assignments-rw b{display:block;font-weight:600;color:var(--t2);font-size:12.5px}
.nc-x-assignments-rw i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--app);color:#fff;font:700 12px/24px var(--font);font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 3px var(--card)}
.nc-x-assignments-rw.due i{background:var(--card);color:var(--del);border:2px solid var(--del);box-shadow:0 0 0 3px var(--card)}
.nc-x-assignments-rw.due i .nc-ic{width:12px;height:12px}
.nc-x-assignments-rw.due b{color:var(--del)}

/* steps, split: one line of summary */
.nc-x-assignments-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
.nc-x-assignments-summary b{color:var(--text);font-weight:620}
.nc-x-assignments-spare{margin-left:auto}
.nc-x-assignments-tiny{height:19px}

/* tile */
.nc-x-assignments-plabel{min-width:0;color:var(--t2)}
.nc-x-assignments-excerpt{font-size:14px;line-height:1.6;color:var(--t2);padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);margin:0}
.nc-x-assignments-excerpt b{color:var(--text)}
.nc-x-assignments-rowic{width:13px;height:13px}

/* change */
.nc-x-assignments-meaning{min-width:170px}
.nc-x-assignments-datebox-early{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:var(--warn-soft)}
.nc-x-assignments-datebox-early small{color:var(--warn)}
.nc-x-assignments-earlier .nc-x-assignments-meaning b{color:var(--warn)}
.nc-x-assignments-label{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nc-x-assignments-label .nc-ic{width:14px;height:14px}
.nc-x-assignments-mv{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14.5px;border-top:1px solid var(--line)}
.nc-x-assignments-mv:first-child{border-top:0;padding-top:0}
.nc-x-assignments-dates{font-size:13px;color:var(--t2);white-space:nowrap;font-variant-numeric:tabular-nums}
.nc-x-assignments-dates del{color:var(--mute);text-decoration-color:var(--del)}
.nc-x-assignments-dates ins{text-decoration:none;color:var(--ok);font-weight:600}

/* missing */
.nc-x-assignments-flag--warn{color:var(--warn)!important}
.nc-x-assignments-flag--mute{color:var(--mute)!important}

/* checklist */
.nc-x-assignments-ringrow{display:flex;align-items:center;gap:16px}
.nc-x-assignments-headline{font-size:16px}
.nc-x-assignments-rowfix{margin:0 -8px;padding:8px;border-radius:10px;transition:background .3s}
.nc-x-assignments-rowfix.is-fixed{background:var(--ok-soft)}

/* rubric */
.nc-step-main .nc-x-assignments-pts{display:inline;color:var(--mute)!important;font-weight:400}
.nc-x-assignments-tips{display:flex;flex-direction:column;gap:12px}

/* split */
.nc-x-assignments-person{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 12px;padding:12px 14px;border-radius:var(--r-inner);border:1px solid var(--line);background:var(--inset)}
.nc-x-assignments-person+.nc-x-assignments-person{margin-top:8px}
.nc-x-assignments-person .nc-av{border:0;margin:0;width:34px;height:34px}
.nc-x-assignments-person-main{min-width:0}
.nc-x-assignments-person-main b{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:620}
.nc-x-assignments-person-main b small{font-size:12px;font-weight:600;color:var(--mute)}
.nc-x-assignments-tasks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nc-x-assignments-task{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--card);border:1px solid var(--line2);font-size:12.5px;color:var(--t2);white-space:nowrap}
.nc-x-assignments-task em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.nc-x-assignments-hrs{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.nc-x-assignments-hrs small{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.nc-x-assignments-person .nc-progress{grid-column:1 / -1;height:5px}
.nc-x-assignments-copybox{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--t2);padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px dashed var(--line3)}

@container chat (max-width:480px){
  .nc-x-assignments-rw{font-size:10.5px}
  .nc-x-assignments-rw b{font-size:11.5px}
  .nc-x-assignments-rw i{width:21px;height:21px;font-size:11px}
  .nc-x-assignments-person{padding:11px 12px;gap:6px 10px}
  .nc-x-assignments-mv{flex-wrap:wrap}
  .nc-x-assignments-mv .nc-x-assignments-dates{flex-basis:100%;padding-left:32px}
}
/* calendar: styles for this area's card layouts (ported from preview/action-cards/calendar.html, nc-x-* → nc-x-calendar-*). */

/* calendar-3: the overlap on the mini timeline */
.nc-x-calendar-left{right:auto!important;width:calc((100% - 60px) / 2)}
.nc-x-calendar-right{left:calc(54px + (100% - 60px) / 2 + 6px)!important}
.nc-x-calendar-overlap{position:absolute;left:54px;right:0;z-index:0;border-radius:6px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--del) 14%,transparent) 0 6px,transparent 6px 12px);border-top:1px dashed color-mix(in srgb,var(--del) 55%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--del) 55%,transparent)}
.nc-x-calendar-ovl-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.nc-x-calendar-ovl-label .nc-badge{height:21px}

/* calendar-8: the reminder banner and the big time */
.nc-x-calendar-notif{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--inset2);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.nc-x-calendar-notif .nc-appicon{--s:36px;--r:9px}
.nc-x-calendar-notif b{display:block;font-size:14px;font-weight:620}
.nc-x-calendar-notif span.m{display:block;font-size:13.5px;color:var(--t2);line-height:1.4}
.nc-x-calendar-notif time{align-self:flex-start;font-size:12px;color:var(--mute);white-space:nowrap}
.nc-x-calendar-rtime{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nc-x-calendar-rtime b{font-size:40px;line-height:1;font-weight:680;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.nc-x-calendar-rtime span{font-size:14px;color:var(--t2)}

/* calendar-6: the memory picture */
.nc-x-calendar-illus{height:19px;margin-left:4px;text-transform:none;letter-spacing:0}
.nc-x-calendar-curvewrap{position:relative}
.nc-x-calendar-cdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--card);border:2px solid var(--app)}
.nc-x-calendar-cex{position:absolute;right:0;top:-2px;font-size:11px;font-weight:650;color:var(--del);background:var(--card);padding:0 3px;letter-spacing:.04em;text-transform:uppercase}
.nc-x-calendar-curve{width:100%;height:84px;display:block;overflow:visible}
.nc-x-calendar-ln{fill:none;stroke:var(--app);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nc-x-calendar-ar{fill:color-mix(in srgb,var(--app) 12%,transparent)}
.nc-x-calendar-gd{stroke:var(--line);stroke-width:1}
.nc-x-calendar-ex{stroke:var(--del);stroke-width:1.5;stroke-dasharray:3 3}

/* calendar-1 and -7: a small fact with a tick, the free time */
.nc-x-calendar-free{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2)}
.nc-x-calendar-free .nc-ic{color:var(--ok);flex:none}
.nc-x-calendar-free.is-mute,.nc-x-calendar-free.is-mute .nc-ic{color:var(--mute)}
.nc-x-calendar-free.is-warn .nc-ic{color:var(--warn)}
.nc-x-calendar-free.is-block{display:flex}
.nc-x-calendar-free b{color:var(--text)}
.nc-x-calendar-sidebar{display:flex;gap:10px;flex-wrap:wrap}

/* calendar-4: the office-hours weekdays */
.nc-x-calendar-dayic{width:17px;height:17px;stroke-width:2.4}
.nc-x-calendar-dayic.is-off{width:15px;height:15px;stroke-width:2}
.nc-week.nc-x-calendar-fixed .nc-day{cursor:default}
.nc-week.nc-x-calendar-fixed .nc-day:hover{background:transparent}
.nc-week.nc-x-calendar-fixed .nc-day[data-sel="true"]{background:var(--inset2);border-color:var(--line2)}
.nc-week.nc-x-calendar-fixed .nc-day[data-sel="true"] .nc-day-load i:first-child{background:var(--app,var(--info));height:4px}

/* the moved time: old struck, new in green */
.nc-x-calendar-sub del{text-decoration:line-through;text-decoration-color:var(--del);color:var(--mute)}
.nc-x-calendar-sub ins{text-decoration:none;color:var(--ok);font-weight:600}

/* calendar-2: "Change" lets the student rename the event here */
.nc-x-calendar-edit[contenteditable="true"]{outline:none;border-radius:6px;box-shadow:0 0 0 1px var(--line2);background:var(--inset);padding:1px 6px;margin:-1px -6px;white-space:normal}
.nc-x-calendar-edit[contenteditable="true"]:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}

@container chat (max-width:480px){
  .nc-x-calendar-rtime b{font-size:34px}
  .nc-x-calendar-notif{padding:10px 12px}
}
/* campus cards: ported from preview/action-cards/campus.html (nc-x-* → nc-x-campus-*). */
.nc-x-campus-place{display:flex;gap:16px;align-items:center;min-width:0}
.nc-x-campus-pic{flex:none;width:76px;height:76px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(120% 120% at 80% 90%,color-mix(in srgb,var(--app) 34%,transparent),transparent 62%),color-mix(in srgb,var(--app) 10%,var(--inset));border:1px solid var(--line2);color:var(--app)}
.nc-x-campus-pic .nc-ic{width:34px;height:34px;stroke-width:1.5}
.nc-x-campus-place h4{margin:0;font-size:18px;font-weight:650;letter-spacing:-.014em;line-height:1.25}
.nc-x-campus-place p{margin:3px 0 0;font-size:13.5px;color:var(--mute)}
.nc-x-campus-place .nc-grow{min-width:0}
.nc-x-campus-slots-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--mute)}
.nc-x-campus-slots-hd b{color:var(--text);font-weight:620;font-size:14px}
.nc-x-campus-slot{position:relative}
.nc-x-campus-slot small{font-size:11px;color:var(--ok);font-weight:650;margin-left:2px}
.nc-x-campus-load{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;min-height:64px}
.nc-x-campus-clsleg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin:2px 0 14px}
.nc-x-campus-clsleg .nc-class{font-size:11.5px;font-weight:550;color:var(--mute)}
.nc-x-campus-load>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.nc-x-campus-load .stack{display:flex;flex-direction:column-reverse;gap:4px;width:100%;max-width:38px}
.nc-x-campus-load i{display:block;height:15px;border-radius:5px;background:var(--app);opacity:.92;animation:nc-rise .5s var(--ease) both}
.nc-x-campus-load span{font-size:11.5px;color:var(--mute);margin-top:4px}
.nc-x-campus-load .is-peak span{color:var(--warn);font-weight:650}
.nc-x-campus-load .empty{height:3px;border-radius:2px;background:var(--line2);opacity:1}
.nc-x-campus-opt{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.nc-x-campus-opt:first-child{border-top:0;padding-top:2px}
.nc-x-campus-opt .nc-appicon{--s:34px;--r:10px}
.nc-x-campus-opt .nc-grow{min-width:0}
.nc-x-campus-opt b{display:block;font-size:14.5px;font-weight:620}
.nc-x-campus-opt span.d{display:block;font-size:13px;color:var(--mute);margin-top:1px;line-height:1.45}
.nc-x-campus-opt>.nc-badge{margin-left:auto;flex:none}
.nc-x-campus-due{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line)}
.nc-x-campus-due .nc-datebox{min-width:64px;padding:8px 10px;border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.nc-x-campus-due .nc-datebox b{font-size:22px}
.nc-x-campus-due .nc-grow{min-width:0}
.nc-x-campus-due .nc-progress{--app:var(--warn)}
.nc-x-campus-due .nc-progress-row>span{color:var(--warn);font-weight:650;white-space:nowrap}
.nc-x-campus-warn{color:var(--warn)!important}
@container chat (max-width:480px){.nc-x-campus-pic{width:56px;height:56px}.nc-x-campus-pic .nc-ic{width:26px;height:26px}.nc-x-campus-load{gap:4px}}
/* chrome cards: ported from preview/action-cards/chrome.html (nc-x-* → nc-x-chrome-*).
   Only the cards: the mock browser window around them in the mockup is the page. */

/* chrome-1: found on this page */
.nc-x-chrome-flag{align-self:flex-start}
.nc-x-chrome-found{margin:2px 0 0;font-size:18px;overflow-wrap:anywhere}

/* chrome-2: numbered summary bullets with ¶ chips */
.nc-x-chrome-badges{gap:8px;flex-wrap:wrap}
.nc-x-chrome-bullets{display:flex;flex-direction:column}
.nc-x-chrome-bl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.nc-x-chrome-bl:first-child{border-top:0;padding-top:0}
.nc-x-chrome-bl .nc-li-num{margin-top:1px;flex:none}
.nc-x-chrome-bl span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.nc-x-chrome-bl .nc-pagechip{flex:none;margin-top:1px}
.nc-x-chrome-url{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* chrome-3: draft excerpt with fade, and the word-count range bar */
.nc-x-chrome-draft{border:1px solid var(--line);border-radius:var(--r-inner);background:var(--inset);padding:12px 14px;position:relative;max-height:112px;overflow:hidden;font-size:13.5px;line-height:1.6;color:var(--t2);overflow-wrap:anywhere}
.nc-x-chrome-draft::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(transparent,var(--card))}
.nc-x-chrome-draft b{color:var(--text)}
.nc-x-chrome-count{margin-bottom:6px}
.nc-x-chrome-count .n{color:var(--text);font-weight:600}
.nc-x-chrome-count .r{margin-left:auto;text-align:right}
.nc-x-chrome-range{position:relative;height:8px;border-radius:999px;background:var(--line2);overflow:hidden}
.nc-x-chrome-range i{position:absolute;top:0;bottom:0;left:0;border-radius:999px}
.nc-x-chrome-range .ok{background:color-mix(in srgb,var(--ok) 55%,transparent)}
.nc-x-chrome-range .warn{background:color-mix(in srgb,var(--warn) 60%,transparent)}

/* chrome-4: Chrome → Northstar handoff art */
.nc-x-chrome-hand{display:flex;align-items:center;gap:0;padding:6px 0 2px}
.nc-x-chrome-win{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line2);overflow:hidden;background:var(--inset)}
.nc-x-chrome-win .wbar{display:flex;gap:4px;padding:7px 9px;background:var(--inset2);border-bottom:1px solid var(--line)}
.nc-x-chrome-win .wbar i{width:6px;height:6px;border-radius:50%;background:var(--line3)}
.nc-x-chrome-win .wbody{display:flex;flex-direction:column;gap:5px;padding:10px}
.nc-x-chrome-win .wbody i{display:block;height:5px;border-radius:3px;background:var(--line3)}
.nc-x-chrome-win .wbody i.u{background:var(--accent);opacity:.55;width:55%;margin-left:auto}
.nc-x-chrome-win small{display:block;text-align:center;padding:0 0 8px;font-size:11.5px;color:var(--mute);font-weight:600}
.nc-x-chrome-link{flex:none;width:62px;position:relative;height:2px;margin:0 6px 14px;background-image:linear-gradient(90deg,var(--accent) 50%,transparent 50%);background-size:8px 2px;animation:nc-x-chrome-flow 1s linear infinite}
.nc-x-chrome-link b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--accent);color:var(--accent-text)}
.nc-x-chrome-link b .nc-ic{width:13px;height:13px;stroke-width:2.4}
@keyframes nc-x-chrome-flow{to{background-position:8px 0}}
@media (prefers-reduced-motion:reduce){.nc-x-chrome-link{animation:none}}

@container chat (max-width:480px){
  .nc-x-chrome-link{width:40px;margin:0 4px 14px}
  .nc-x-chrome-found{font-size:17px}
}
/* classes: styles for this area's card layouts. Ported from the mockup's page styles
   (preview/action-cards/classes.html); every one-off class is nc-x-classes-*.
   Only kit tokens, both themes, and the same ≤480px container query as the kit. */

/* syllabus answer: what the rule means, as bars */
.nc-x-classes-late{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.nc-x-classes-late>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);text-align:center}
.nc-x-classes-late b{font-size:15px;color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.nc-x-classes-late i{display:block;width:100%;height:calc(var(--h) * 0.5px);min-height:10px;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--app) calc(var(--o) * 1%),transparent);animation:nc-rise .6s var(--ease) both}
.nc-x-classes-lbl{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}

/* instructor: label / value rows */
.nc-x-classes-kv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;min-width:0}
.nc-x-classes-kv:first-child{border-top:0;padding-top:0}
.nc-x-classes-kv .nc-ic{width:16px;height:16px;color:var(--mute);flex:none}
.nc-x-classes-kv span.k{width:78px;color:var(--mute);flex:none;font-size:13.5px}
.nc-x-classes-kv span.v{flex:1;min-width:0;overflow-wrap:anywhere}
.nc-x-classes-kv span.v.is-muted{color:var(--mute)}
.nc-x-classes-kv button.cp{border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.nc-x-classes-kv button.cp:hover{background:var(--inset2);color:var(--text)}
.nc-x-classes-kv button.cp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nc-x-classes-kv button.cp .nc-ic{color:inherit}

/* class snapshot: the class chip, and the five-row list */
.nc-x-classes-chip{--s:40px;--r:11px;font-weight:700;font-size:13px;letter-spacing:.02em;background:linear-gradient(180deg,color-mix(in srgb,var(--app) 86%,#fff) 0%,var(--app) 100%)}
.nc-x-classes-chip.is-long{font-size:10.5px;letter-spacing:0}
.nc-x-classes-ctitle{display:block;font-size:16px;font-weight:640;overflow-wrap:anywhere}
.nc-x-classes-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.nc-x-classes-row:first-child{border-top:0;padding-top:2px}
.nc-x-classes-row:last-child{padding-bottom:0}
.nc-x-classes-row .cc{width:10px;height:36px;border-radius:5px;background:var(--app,var(--accent))}
.nc-x-classes-row b{display:block;font-size:14.5px;font-weight:620;overflow-wrap:anywhere}
.nc-x-classes-row span.s{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-x-classes-row .g{text-align:right;font-size:16px;font-weight:660;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nc-x-classes-row .g small{display:block;font-size:11.5px;font-weight:500;color:var(--ok);letter-spacing:0}
.nc-x-classes-row .g small.is-est{color:var(--warn)}

/* sources disagree: side by side */
.nc-x-classes-cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.nc-x-classes-side{padding:14px;border-radius:var(--r-inner);border:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;min-width:0}
.nc-x-classes-side .nc-x-classes-lbl{justify-content:space-between}
.nc-x-classes-side .d{font-size:24px;font-weight:660;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.nc-x-classes-side .d small{display:block;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0}
.nc-x-classes-side .f{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nc-x-classes-mid{display:grid;place-items:center}
.nc-x-classes-mid b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);font-size:16px;font-weight:700;border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent)}
/* once the student picked a date the card is no longer a warning */
.nc-card--alert[data-status="done"]{border-color:var(--line2)}
.nc-card--alert[data-status="done"] .nc-card-hd{background:none}

/* attendance: one big dot per absence */
.nc-x-classes-pips{display:flex;gap:14px;justify-content:center;padding:6px 0 2px}
.nc-x-classes-pip{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);text-align:center;min-width:92px}
.nc-x-classes-pipc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);border:2px solid var(--warn);color:var(--warn);animation:nc-pop .5s var(--ease-spring) both}
.nc-x-classes-pipc .nc-ic{width:24px;height:24px;stroke-width:2.2}
.nc-x-classes-pip.is-free .nc-x-classes-pipc{background:transparent;border:2px dashed var(--line3);color:var(--mute);animation-delay:.25s}
.nc-x-classes-pip b{display:block;font-size:13.5px;color:var(--text);font-weight:600}

.nc-flags li .nc-ic.nc-x-classes-warn{color:var(--warn)}

/* lecture files */
.nc-x-classes-file{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.nc-x-classes-file:first-child{border-top:0;padding-top:0}
.nc-x-classes-file-ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--app) 16%,transparent);color:color-mix(in srgb,var(--app) 65%,var(--text))}
.nc-x-classes-file-main{flex:1;min-width:0}
.nc-x-classes-file-main b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-x-classes-file-main span{display:block;font-size:13px;color:var(--mute)}
.nc-x-classes-tags{display:flex;flex-wrap:wrap;gap:6px}
.nc-thumb.nc-x-classes-slide{width:var(--w,210px)}

/* required materials */
.nc-x-classes-srcs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}

@container chat (max-width:480px){
  .nc-thumb.nc-x-classes-slide{width:100%}
  .nc-x-classes-cmp{grid-template-columns:1fr}
  .nc-x-classes-mid{height:30px}
  .nc-x-classes-pips{gap:6px}
  .nc-x-classes-pip{min-width:80px}
  .nc-x-classes-kv span.k{width:62px}
}
/* coach: styles for this area's card layouts (ported from preview/action-cards/coach.html, nc-x-* → nc-x-coach-*). */

/* the plan: numbered steps, plain text colour, the app as a chip on the right */
.nc-x-coach-plan .nc-step[data-state="todo"]{color:var(--text)}
.nc-x-coach-plan .nc-step-ic{font-size:11.5px;font-weight:700;color:var(--t2);font-variant-numeric:tabular-nums}
.nc-x-coach-plan .nc-step{padding:9px 0}
.nc-x-coach-plan .nc-step-ic .nc-ic,.nc-x-coach-plan .nc-step-ic .nc-spin{display:none}
.nc-x-coach-plan .nc-step:not(:last-child)::after{top:36px;bottom:-8px}
.nc-x-coach-plan .nc-step-time{padding-top:0;align-self:center}
.nc-x-coach-wont{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);padding:10px 12px;border-radius:var(--r-inner);background:var(--inset);border:1px dashed var(--line2)}
.nc-x-coach-wont .nc-ic{color:var(--ok);width:16px;height:16px;flex:none}
.nc-x-coach-wont b{color:var(--t2);font-weight:600}

/* moved from one day to another */
.nc-x-coach-move{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nc-x-coach-day{border:1px solid var(--line);border-radius:var(--r-inner);background:var(--inset);padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;align-self:stretch}
.nc-x-coach-day h5{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:650}
.nc-x-coach-task{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);min-width:0}
.nc-x-coach-task span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-x-coach-task::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--app);flex:none}
.nc-x-coach-day.is-from .nc-x-coach-task{opacity:.5;text-decoration:line-through;text-decoration-color:var(--del)}
.nc-x-coach-day.is-to{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-soft)}
.nc-x-coach-day.is-to h5{color:var(--ok)}
.nc-x-coach-day.is-to .nc-x-coach-task{animation:nc-rise .45s var(--ease) both}
.nc-x-coach-day.is-to .nc-x-coach-task:nth-child(3){animation-delay:.1s}
.nc-x-coach-day.is-to .nc-x-coach-task:nth-child(4){animation-delay:.2s}

/* an app-coloured icon tile (batch rows, receipt rows) */
.nc-x-coach-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;background:var(--app,var(--accent))}
.nc-x-coach-ico .nc-ic{width:16px;height:16px;stroke-width:2}

/* the turn receipt */
.nc-x-coach-rcpt{display:flex;flex-direction:column}
.nc-x-coach-rc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.nc-x-coach-rc:first-child{border-top:0;padding-top:2px}
.nc-x-coach-rc b{display:block;font-size:14.5px;font-weight:600}
.nc-x-coach-rc span.d{display:block;font-size:13px;color:var(--mute)}

/* memory: what it changes */
.nc-x-coach-why{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.nc-x-coach-why div{display:flex;align-items:center;gap:9px}
.nc-x-coach-why .nc-ic{width:15px;height:15px;color:var(--accent-text);flex:none}

@container chat (max-width:480px){
  .nc-x-coach-move{grid-template-columns:1fr}
  .nc-x-coach-move .nc-arrow{transform:rotate(90deg);justify-self:center}
}
/* degree: styles for this area's card layouts (ported from preview/action-cards/degree.html,
   one-off nc-x-* rules renamed nc-x-degree-*). Kit tokens only; both themes; container query
   at 480px like the kit. */

/* ---------- degree-1 · registration countdown ---------- */
.nc-x-degree-count .nc-stat-num small{margin-left:.36em}
.nc-x-degree-runway{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);justify-items:center;gap:0;align-items:center}
.nc-x-degree-runway i{width:8px;height:8px;border-radius:50%;background:var(--line3);animation:nc-pop .4s var(--ease-spring) both;animation-delay:calc(var(--n) * 14ms)}
.nc-x-degree-runway i.is-now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nc-x-degree-runway i.is-wk{background:var(--line2)}
.nc-x-degree-runway i.is-end{background:var(--app);width:12px;height:12px;box-shadow:0 0 0 3px color-mix(in srgb,var(--app) 25%,transparent)}
.nc-x-degree-runway-lbl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);margin-top:8px}
.nc-x-degree-when{border-color:color-mix(in srgb,var(--app) 60%,transparent);background:color-mix(in srgb,var(--app) 14%,transparent)}
.nc-x-degree-when small{color:var(--t2)}

/* ---------- degree-2 · week grid ---------- */
.nc-x-degree-wk{--hh:44px;--rows:8;display:grid;grid-template-columns:34px repeat(var(--cols,5),minmax(0,1fr));gap:0 4px}
.nc-x-degree-wk .hd{text-align:center;color:var(--mute);font-size:12px;padding-bottom:6px;font-weight:600}
.nc-x-degree-wk .tm{position:relative;height:calc(var(--rows) * var(--hh))}
.nc-x-degree-wk .tm span{position:absolute;right:4px;top:calc(var(--i) * var(--hh) - 7px);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nc-x-degree-col{position:relative;height:calc(var(--rows) * var(--hh));border-radius:8px;background-color:var(--inset);background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.nc-x-degree-blk{position:absolute;left:3px;right:3px;top:calc(var(--at) * var(--hh) + 1px);height:calc(var(--len) * var(--hh) - 2px);border-radius:7px;padding:4px 6px;background:color-mix(in srgb,var(--app) 24%,var(--card));box-shadow:inset 3px 0 0 var(--app);font-size:11.5px;font-weight:650;line-height:1.2;overflow:hidden;animation:nc-rise .5s var(--ease) both}
.nc-x-degree-blk small{display:block;font-weight:450;color:var(--t2);font-size:10.5px;margin-top:1px}
.nc-x-degree-wkkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:10px}

/* ---------- degree-3 · section compare ---------- */
.nc-x-degree-sec{position:relative;text-align:left;display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--text);min-width:0;font:inherit;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .12s}
.nc-x-degree-sec:hover:not(:disabled){background:var(--inset);border-color:var(--line3)}
.nc-x-degree-sec:active:not(:disabled){transform:scale(.99)}
.nc-x-degree-sec:disabled{cursor:default}
.nc-x-degree-sec[aria-checked="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:var(--accent-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent) inset}
.nc-x-degree-sec-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--mute);letter-spacing:.02em}
.nc-x-degree-sec-top .nc-option-key{width:24px;height:24px;border-radius:7px;font-size:12px}
.nc-x-degree-sec[aria-checked="true"] .nc-option-key{background:var(--accent);color:#fff}
.nc-x-degree-sec-top .nc-option-tag{margin-left:auto}
.nc-x-degree-sec .big{font-size:21px;font-weight:660;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.nc-x-degree-sec .big small{display:block;font-size:12.5px;font-weight:450;color:var(--mute);letter-spacing:0;margin-top:3px}
.nc-x-degree-sec dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.nc-x-degree-sec dt{color:var(--mute)}
.nc-x-degree-sec dd{margin:0;color:var(--t2);min-width:0}
.nc-x-degree-seats{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute)}
.nc-x-degree-seats b{color:var(--text);font-weight:620}
.nc-x-degree-seats.is-low b{color:var(--warn)}
.nc-x-degree-fit{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.4;color:var(--t2)}
.nc-x-degree-fit .nc-mark{width:18px;height:18px;margin-top:0}
.nc-x-degree-fit .nc-mark .nc-ic{width:11px;height:11px}

/* ---------- degree-6 · prerequisite chain ---------- */
.nc-x-degree-chain{display:flex;align-items:stretch;justify-content:center}
.nc-x-degree-node{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding:12px 12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--inset)}
.nc-x-degree-node b{font-size:14.5px;font-weight:620;letter-spacing:-.005em}
.nc-x-degree-node span.s{font-size:12.5px;color:var(--mute);line-height:1.35}
.nc-x-degree-node.is-now{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.nc-x-degree-node.is-goal{border-style:dashed;border-color:var(--line3);background:transparent}
.nc-x-degree-link{flex:none;width:28px;display:grid;place-items:center;color:var(--faint)}
.nc-x-degree-link .nc-ic{width:16px;height:16px}
.nc-card .nc-card-bd>.nc-x-degree-ft.nc-card-ft{margin:18px -18px -18px}

/* ---------- degree-7 · waitlist ---------- */
.nc-x-degree-queue{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nc-x-degree-q{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:54px;font-size:12px;color:var(--mute)}
.nc-x-degree-q .nc-av{margin:0;border:0;width:38px;height:38px;font-size:12.5px;background:var(--line3);color:var(--t2)}
.nc-x-degree-q.is-you .nc-av{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.nc-x-degree-q.is-you{color:var(--accent-text);font-weight:650}
.nc-x-degree-q.is-seat .nc-av{background:transparent;border:1.5px dashed var(--line3);color:var(--mute)}
.nc-x-degree-qa{color:var(--faint);margin-bottom:18px}
.nc-x-degree-qa .nc-ic{width:14px;height:14px}
.nc-x-degree-lbl{font-size:12px;color:var(--faint);margin:0 0 2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.nc-x-degree-hist{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px;height:104px;align-items:end}
.nc-x-degree-hist>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.nc-x-degree-hist i{display:block;width:100%;max-width:56px;height:calc(var(--h) * .5px);min-height:8px;border-radius:7px 7px 4px 4px;background:var(--line3);transform-origin:bottom;animation:nc-x-degree-up .7s var(--ease) both}
.nc-x-degree-hist .is-now i{background:var(--app)}
.nc-x-degree-hist b{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.nc-x-degree-hist .is-now b{color:var(--accent-text)}
.nc-x-degree-hist span{font-size:11.5px;color:var(--mute)}
@keyframes nc-x-degree-up{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- degree-5 · progress ring with an estimate arc behind ---------- */
.nc-x-degree-est{stroke:var(--app);opacity:.28;stroke-dasharray:100 100}

@container chat (max-width:480px){
  .nc-x-degree-chain{flex-direction:column}
  .nc-x-degree-link{width:auto;height:22px;transform:rotate(90deg)}
  .nc-x-degree-wk{grid-template-columns:26px repeat(var(--cols,5),minmax(0,1fr));gap:0 2px}
  .nc-x-degree-blk{left:1px;right:1px;padding:4px 3px 4px 7px;font-size:10px}
  .nc-x-degree-blk small{display:none}
  .nc-x-degree-wk .tm span{font-size:9.5px}
  .nc-x-degree-runway i{width:7px;height:7px}
  .nc-x-degree-runway i.is-end{width:12px;height:12px}
}
@media (prefers-reduced-motion:reduce){
  .nc-x-degree-runway i,.nc-x-degree-blk,.nc-x-degree-hist i{animation:none}
}
/* email: styles for this area's card layouts. Ported from preview/action-cards/email.html
   (its page <style>, nc-x-* renamed nc-x-email-*). Kit tokens only; the container
   query is the same 480px switch the kit uses. */

/* email-1: checks under the message */
.nc-x-email-chips{display:flex;flex-wrap:wrap;gap:6px}
.nc-x-email-wrap{flex-wrap:wrap;row-gap:6px}

/* email-10: 20 ticks */
.nc-x-email-ticks{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px;height:26px}
.nc-x-email-ticks i{display:block;border-radius:4px;background:var(--line2);transition:background .3s}
.nc-x-email-ticks i.is-on{background:var(--mute);animation:nc-grow .6s var(--ease) both;transform-origin:bottom}
.nc-x-email-ticks i.is-hot{background:var(--warn)}
.nc-x-email-ticks i.is-full{background:var(--del)}
.nc-x-email-ticks.is-calm i.is-on{background:var(--accent)}
.nc-x-email-tickscale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:6px}
.nc-x-email-limitrow{justify-content:space-between;flex-wrap:wrap;row-gap:8px}
/* An amber or red limit card wears the alert frame, like the heads-up cards */
.nc-card[data-card-type="stat"]:has(.nc-x-email-ticks:not(.is-calm) i.is-hot){border-color:color-mix(in srgb,var(--warn) 30%,var(--line2))}
.nc-card[data-card-type="stat"]:has(.nc-x-email-ticks:not(.is-calm) i.is-hot) .nc-card-hd{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 7%,transparent),transparent 70%)}
.nc-card[data-card-type="stat"]:has(.nc-x-email-ticks i.is-full){border-color:color-mix(in srgb,var(--del) 34%,var(--line2))}
.nc-card[data-card-type="stat"]:has(.nc-x-email-ticks i.is-full) .nc-card-hd{background:linear-gradient(90deg,color-mix(in srgb,var(--del) 8%,transparent),transparent 70%)}

/* the sender line above a quoted email (email-3, -5, -8) */
.nc-x-email-mailhd{display:flex;align-items:flex-start;gap:12px;min-width:0}
.nc-x-email-mailhd .nc-av{margin:0;border:0;width:36px;height:36px;flex:none}
.nc-x-email-mailhd-main{min-width:0;flex:1}
.nc-x-email-mailhd-main b{display:flex;align-items:baseline;gap:8px;font-size:14.5px;font-weight:620}
.nc-x-email-mailhd-from{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-x-email-mailhd-main b time{margin-left:auto;font-size:12.5px;font-weight:450;color:var(--mute);white-space:nowrap}
.nc-x-email-mailhd-main span{display:block;font-size:14px;color:var(--t2)}
.nc-x-email-emailq{margin:0;padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);font-size:14.5px;line-height:1.65;color:var(--t2);white-space:pre-line}
.nc-x-email-emailq mark{background:color-mix(in srgb,var(--app,var(--accent)) 24%,transparent);color:var(--text);border-radius:4px;padding:0 3px}
.nc-x-email-emailq b{color:var(--text)}
.nc-x-email-ask{font-size:15.5px;--app:var(--warn)}
.nc-x-email-toneh{margin-bottom:8px}
.nc-x-email-tonetext{margin-top:10px}

/* the source line goes once the dates or tasks are added (the list above says it all) */
.nc-card-bd:has(.nc-x-email-results) .nc-src{display:none}

/* email-4: who the new mail is from */
.nc-x-email-seg{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:3px}
.nc-x-email-seg i{display:block;flex:var(--w) 1 0;background:var(--c);border-radius:3px;animation:nc-grow .8s var(--ease) both;transform-origin:left}
.nc-x-email-segkey{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13.5px;color:var(--t2)}
.nc-x-email-segkey span{display:inline-flex;align-items:center;gap:7px}
.nc-x-email-segkey i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.nc-x-email-segkey b{font-weight:650;font-variant-numeric:tabular-nums}
.nc-x-email-unread{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;margin-top:6px}
.nc-x-email-flag{flex:none;height:18px;font-size:11px}

/* email-7: the fake domain in the From line */
.nc-x-email-host{color:var(--del);font-weight:650}

/* email-9: decided / still open / your turn */
.nc-x-email-people{gap:12px}
.nc-x-email-sum{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.nc-x-email-sum:first-child{border-top:0;padding-top:0}
.nc-x-email-sum-k{flex:none;width:84px;padding-top:1px}
.nc-x-email-sum-k .nc-badge{width:100%;justify-content:center}
.nc-x-email-sum p{margin:0;font-size:14.5px;line-height:1.5;color:var(--text);flex:1;min-width:0}
.nc-x-email-sum p span{color:var(--mute);display:block;font-size:13px}

/* email-6: sent → quiet → due */
.nc-x-email-tl{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:start;gap:0;padding:4px 2px}
.nc-x-email-tl-n{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;color:var(--mute);line-height:1.3;min-width:70px}
.nc-x-email-tl-n b{font-size:13px;color:var(--text);font-weight:600}
.nc-x-email-tl-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.nc-x-email-tl-dot .nc-ic{width:13px;height:13px;stroke-width:2.6}
.nc-x-email-tl-dot.is-wait{background:var(--warn-soft);color:var(--warn)}
.nc-x-email-tl-dot.is-due{background:transparent;border:1.5px dashed var(--line3);color:var(--mute)}
.nc-x-email-tl-l{height:2px;background:var(--line2);position:relative;margin:12px 6px 0}
.nc-x-email-tl-l.is-warn{background:repeating-linear-gradient(90deg,var(--warn) 0 6px,transparent 6px 10px)}
.nc-x-email-tl-l i{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:650;color:var(--warn);white-space:nowrap}
.nc-x-email-tl-l.is-warn i{top:8px}

/* email-2, email-7: one line about an email that's gone out or been hidden */
.nc-x-email-sentrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);min-width:0}
.nc-x-email-sentrow .nc-av{margin:0;border:0;width:34px;height:34px;flex:none}
.nc-x-email-sentrow-main{min-width:0;flex:1}
.nc-x-email-sentrow b{display:block;font-size:14.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-x-email-sentrow-main span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-x-email-caprow{justify-content:space-between;flex-wrap:wrap;row-gap:6px}

/* email-11: the after row is centred under the connection */
.nc-card[data-card-type="connect"][data-app="outlook"] .nc-after{justify-content:center}

@container chat (max-width:480px){
  .nc-x-email-sum{flex-wrap:wrap;gap:6px}
  .nc-x-email-sum-k{width:auto}
  .nc-x-email-sum-k .nc-badge{width:auto}
  .nc-x-email-sum p{flex-basis:100%}
  .nc-x-email-tl-n{min-width:54px}
  .nc-x-email-ticks{gap:3px}
}
/* goals: styles for this area's card layouts (prefix nc-x-goals-). Kit tokens only; the ≤480px layout follows the kit's chat container query. */

/* chips (focus extras, break tips) */
.nc-x-goals-mute{display:flex;flex-wrap:wrap;gap:6px}
.nc-x-goals-mute .nc-badge{height:26px;padding:0 10px;font-weight:550;color:var(--t2)}
.nc-x-goals-mute .nc-badge em{font-style:normal;color:var(--faint);font-weight:500}
.nc-x-goals-note{margin:0}
.nc-x-goals-tips{margin-top:4px}

/* buttons that sit inside a body (the timer cards draw their own) */
.nc-x-goals-row{padding:0!important;margin-top:2px}
.nc-x-goals-after{padding:0!important}

/* goal progress */
.nc-x-goals-hero{gap:16px}
.nc-x-goals-hero .nc-stat-num small{margin-left:.36em}
.nc-x-goals-tile{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none;background:color-mix(in srgb,var(--app) 18%,transparent);color:var(--app)}
.nc-x-goals-tile .nc-ic{width:22px;height:22px}
.nc-x-goals-side{margin-left:auto;text-align:right}
.nc-x-goals-next{margin:0}
.nc-x-goals-barlabel{color:var(--text);font-weight:560}
.nc-x-goals-streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nc-x-goals-sd{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
.nc-x-goals-sd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line3);color:var(--faint);font-style:normal;transition:all .3s var(--ease)}
.nc-x-goals-sd i .nc-ic{width:16px;height:16px;stroke-width:2.4}
.nc-x-goals-sd.is-done i{background:color-mix(in srgb,var(--app) 20%,transparent);border:1.5px solid var(--app);color:var(--app)}
.nc-x-goals-sd.is-today i{border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent-text)}
.nc-x-goals-sd.is-done.is-today i{background:color-mix(in srgb,var(--app) 20%,transparent);border-color:var(--app);color:var(--app)}
.nc-x-goals-sd.is-today{color:var(--text);font-weight:600}

/* routine */
.nc-x-goals-repeat{gap:12px;flex-wrap:wrap}
.nc-x-goals-pause{margin-left:auto}
.nc-x-goals-dow{display:flex;gap:6px;align-items:center}
.nc-x-goals-dow i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:650;color:var(--mute);background:var(--inset2)}
.nc-x-goals-dow i.is-on{background:var(--app);color:#fff}
.nc-x-goals-foot{display:flex;align-items:center;gap:8px;margin:0}
.nc-x-goals-foot .nc-ic{width:14px;height:14px;flex:none}

/* routine ran */
.nc-x-goals-checked{gap:6px;flex-wrap:wrap}
.nc-x-goals-ok{color:var(--ok)}
.nc-x-goals-warn{background:var(--warn-soft);color:var(--warn)}

/* check-in */
.nc-x-goals-mood{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nc-x-goals-mt{--c:var(--accent);display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 8px 14px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--t2);font:inherit;font-size:14.5px;font-weight:580;cursor:pointer;transition:border-color .18s,background .18s,transform .18s var(--ease-spring),color .18s}
.nc-x-goals-mt .nc-ic{width:32px;height:32px;stroke-width:1.5;color:var(--mute);transition:color .18s,transform .3s var(--ease-spring)}
.nc-x-goals-mt:hover:not(:disabled){background:var(--inset);border-color:var(--line3)}
.nc-x-goals-mt:active:not(:disabled){transform:scale(.96)}
.nc-x-goals-mt:disabled{cursor:default;opacity:.4}
.nc-x-goals-mt[aria-checked="true"]{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--text)}
.nc-x-goals-mt[aria-checked="true"]:disabled{opacity:1}
.nc-x-goals-mt[aria-checked="true"] .nc-ic{color:var(--c);transform:scale(1.12)}
.nc-x-goals-mt[data-mood="great"]{--c:var(--ok)}
.nc-x-goals-mt[data-mood="rough"]{--c:var(--warn)}
.nc-x-goals-moodhist{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mute)}
.nc-x-goals-moodhist div{display:flex;gap:6px}
.nc-x-goals-moodhist i{width:12px;height:12px;border-radius:50%;background:var(--c,var(--line3))}

/* break reminder */
.nc-x-goals-ask{gap:20px;flex-wrap:wrap}
.nc-x-goals-asktext{min-width:180px}
.nc-x-goals-headline{font-weight:600;font-size:16.5px;letter-spacing:-.01em}
.nc-x-goals-over{gap:12px}

@container chat (max-width:480px){
  .nc-x-goals-streak{gap:2px}
  .nc-x-goals-sd i{width:30px;height:30px}
  .nc-x-goals-mt{padding:14px 4px 12px}
  .nc-x-goals-mt .nc-ic{width:28px;height:28px}
}
/* grades: styles for this area's card layouts (nc-x-grades-*). Kit tokens only; both themes; both widths (container query <=480px like the kit). */

/* grades-2: an out-of-reach goal turns the answer amber and says so */
.nc-x-grades-hardnote{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn);margin:0}
.nc-x-grades-hardnote .nc-ic{width:14px;height:14px;flex:none}
.nc-x-grades-chips{gap:8px}
.nc-x-grades-chips .nc-choicechip{height:32px;padding:0 13px;font-variant-numeric:tabular-nums}
.nc-x-grades-chips .nc-choicechip small{color:var(--mute);font-size:12px;margin-left:2px}
.nc-x-grades-chips .nc-choicechip[aria-checked="true"] small{color:inherit;opacity:.8}

/* small caps label (grades-4 "What pulled it down") */
.nc-x-grades-lbl{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}

/* grades-3: class grade so far */
.nc-x-grades-kpis{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.nc-x-grades-kpi small{display:block;font-size:12.5px;color:var(--mute)}
.nc-x-grades-kpi b{display:block;font-size:30px;line-height:1.1;font-weight:680;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.nc-x-grades-kpi b small{display:inline;font-size:16px;font-weight:600;color:var(--mute);margin-left:2px}

/* grades-3 / grades-5: per-category and per-class bars */
.nc-x-grades-bars .nc-bar-lbl small{margin-left:4px}

/* grades-5: the likely range on a 0 to 4 scale (striped = Estimate) */
.nc-x-grades-range{position:relative;height:30px;border-radius:999px;background:var(--line2)}
.nc-x-grades-range i{position:absolute;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(135deg,var(--app) 0 4px,color-mix(in srgb,var(--app) 55%,transparent) 4px 8px)}
.nc-x-grades-range b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.nc-x-grades-rangelbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:6px}
.nc-x-grades-note{font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:flex-start;line-height:1.5;margin:0 0 12.5px}
.nc-x-grades-note .nc-ic{width:14px;height:14px;margin-top:2px;flex:none}
.nc-x-grades-note b{color:var(--t2)}

/* grades-6: the posted score the regrade is about */
.nc-x-grades-regr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);font-size:14px;min-width:0}
.nc-x-grades-regr b{font-weight:620}
.nc-x-grades-regr .nc-grow{min-width:0}
.nc-x-grades-regr .nc-grow span{display:block;font-size:12.5px;color:var(--mute)}

/* grades-7: the wait, drawn (turned in ---- days, no grade ---- today) */
.nc-x-grades-wait{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0;padding:6px 2px}
.nc-x-grades-wait .n{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;color:var(--mute);line-height:1.3;min-width:76px}
.nc-x-grades-wait .n b{font-size:13px;color:var(--text);font-weight:600}
.nc-x-grades-wait .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.nc-x-grades-wait .dot .nc-ic{width:13px;height:13px;stroke-width:2.6}
.nc-x-grades-wait .dot.w{background:var(--warn-soft);color:var(--warn)}
.nc-x-grades-wait .l{height:2px;position:relative;margin:0 6px;top:-14px;background:repeating-linear-gradient(90deg,var(--warn) 0 6px,transparent 6px 10px)}
.nc-x-grades-wait .l i{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:650;color:var(--warn);white-space:nowrap}

@container chat (max-width:480px){
  .nc-x-grades-bars .nc-bar{grid-template-columns:92px 1fr auto}
  .nc-x-grades-bars .nc-bar-lbl small{display:none}
  .nc-x-grades-kpis{gap:14px}
  .nc-x-grades-wait .n{min-width:62px}
}

/* The app's own input styles paint a box behind range inputs; the kit draws the track itself. */
.nc-card input.nc-range{background:transparent}
/* settings: styles for this area's card layouts (nc-x-settings-*). Ported from the
   approved mockup preview/action-cards/settings.html; kit tokens only, both themes. */

.nc-x-settings-num small{margin-left:.36em}

/* a thing (folder, file) the coach asks about */
.nc-x-settings-pathrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);min-width:0}
.nc-x-settings-pathrow .nc-appicon{--s:34px;--r:10px}
.nc-x-settings-pathrow code{font-family:var(--mono);font-size:13.5px;color:var(--text);display:block;white-space:normal;overflow-wrap:anywhere}
.nc-x-settings-pathrow small{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.nc-x-settings-pathrow .nc-badge{flex:none}

/* two boxes: I can / I can't, or would be sent / stays on your Mac */
.nc-x-settings-can{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc-x-settings-can>div{padding:12px 14px;border-radius:var(--r-inner);border:1px solid var(--line);background:var(--inset);min-width:0}
.nc-x-settings-can h5{margin:0 0 7px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;display:flex;align-items:center;gap:6px}
.nc-x-settings-can h5.ok{color:var(--ok)}
.nc-x-settings-can h5.no{color:var(--del)}
.nc-x-settings-can h5 .nc-ic{width:14px;height:14px;stroke-width:2.4}
.nc-x-settings-can ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--t2);line-height:1.4}

/* the row under "permission given": the shared after-row look, inside the card body */
.nc-card-bd:has(>.nc-x-settings-after){padding:0}
.nc-card:has(.nc-x-settings-after)>.nc-actions{display:none}
.nc-x-settings-after{padding-top:14px}

/* one connection */
.nc-x-settings-conn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-inner);border:1px solid var(--line);background:var(--inset);min-width:0}
.nc-x-settings-conn .nc-appicon{--s:34px;--r:10px}
.nc-x-settings-conn b{display:block;font-size:14.5px;font-weight:620}
.nc-x-settings-conn span.d{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.nc-x-settings-conn.is-warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.nc-x-settings-conn .nc-badge{margin-left:auto;flex:none}
/* the connection card is amber when something needs the student (the kit's alert look, on a number card) */
.nc-card:has(.nc-x-settings-warn){border-color:color-mix(in srgb,var(--warn) 30%,var(--line2))}
.nc-card:has(.nc-x-settings-warn) .nc-card-hd{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 7%,transparent),transparent 70%)}
/* a failed card that worked on retry is an ordinary card again */
.nc-card--danger:has(.nc-x-settings-ok){border-color:var(--line2)}
.nc-card--danger:has(.nc-x-settings-ok) .nc-card-hd{background:var(--card-hd)}

/* Mac -> cloud flow */
.nc-x-settings-flow{display:flex;align-items:center;padding:6px 6px 0}
.nc-x-settings-fn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--t2);font-weight:560;min-width:84px;text-align:center}
.nc-x-settings-fn .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--inset2);border:1px solid var(--line2)}
.nc-x-settings-fn .ico .nc-ic{width:26px;height:26px;stroke-width:1.6}
.nc-x-settings-fn.cloud .ico{border-style:dashed;color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.nc-x-settings-wire{position:relative;flex:1;height:2px;margin:0 8px 26px;background-image:linear-gradient(90deg,var(--line3) 50%,transparent 50%);background-size:8px 2px}
.nc-x-settings-wire b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line3);font-size:12px;font-weight:620;color:var(--t2);white-space:nowrap}
.nc-x-settings-wire b .nc-ic{width:12px;height:12px;color:var(--warn)}
.nc-x-settings-wire i{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--faint)}

/* a setting and its switch */
.nc-x-settings-set{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line)}
.nc-x-settings-set .nc-appicon{--s:38px;--r:11px}
.nc-x-settings-set b{display:block;font-size:15px;font-weight:620}
.nc-x-settings-set span.d{display:block;font-size:13px;color:var(--mute)}
.nc-x-settings-switch{flex:none;margin-left:auto;width:46px;height:28px;border-radius:999px;position:relative;background:var(--ok);animation:nc-x-settings-swbg .5s .35s var(--ease) both}
.nc-x-settings-switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);box-shadow:0 1px 3px color-mix(in srgb,var(--btn-pri-fg) 45%,transparent);transform:translateX(18px);animation:nc-x-settings-knob .5s .35s var(--ease-spring) both}
.nc-x-settings-switch.is-off{background:var(--line3);animation:none}

/* the knob is white in both themes: light text on dark, the white card colour on light */
html[data-theme="light"] .nc-x-settings-switch::after{background:var(--card);box-shadow:0 1px 3px color-mix(in srgb,var(--text) 30%,transparent)}
@keyframes nc-x-settings-knob{from{transform:translateX(0)}to{transform:translateX(18px)}}
@keyframes nc-x-settings-swbg{from{background:var(--line3)}to{background:var(--ok)}}
@media (prefers-reduced-motion:reduce){.nc-x-settings-switch,.nc-x-settings-switch::after{animation:none}}

/* a file tile */
.nc-x-settings-zip{flex:none;width:72px;height:84px;border-radius:14px;display:grid;place-items:center;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--app) 22%,var(--card)),color-mix(in srgb,var(--app) 8%,var(--card)));border:1px solid var(--line2);color:var(--t2)}
.nc-x-settings-zip .nc-ic{width:30px;height:30px;stroke-width:1.5}
.nc-x-settings-zip small{position:absolute;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mute)}

/* version boxes */
.nc-x-settings-ver{display:grid;place-items:center;min-width:92px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);line-height:1.1}
.nc-x-settings-ver small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nc-x-settings-ver b{font-size:19px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.nc-x-settings-ver.is-new{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:var(--ok-soft)}
.nc-x-settings-ver.is-new small{color:var(--ok)}
.nc-x-settings-upd .nc-li-num .nc-ic{width:13px;height:13px}

/* the technical details of a failure */
.nc-x-settings-mono{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--t2);padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);overflow-wrap:anywhere}

@container chat (max-width:480px){.nc-x-settings-can{grid-template-columns:1fr}.nc-x-settings-fn{min-width:64px}.nc-x-settings-fn .ico{width:46px;height:46px}.nc-x-settings-zip{width:56px;height:66px}}
/* studio: styles for this area's card layouts (classes nc-x-studio-*). Ported from the approved mockup's page styles (preview/action-cards/studio.html); colours are the kit's tokens, so both themes work, and the chat-width rules apply at 480px and narrower. */

/* Redesign v2 design tokens: ported 1:1 from the redesign mockup
   (preview/northstar-redesign-src/core.head.html, "Tokens first").

   Two layers:
   1. --v2-* tokens are the mockup's own values (light and dark). New code and
      src/redesign/components.css read these.
   2. The app's older token names (--bg, --side, --raise, --text, --mute, --line,
      --accent, --del …, set in src/codex/codex.css) are re-pointed at the same
      values, so every existing page picks up the new palette without edits.

   Theme switching stays the app's real setting: lib/preferences.js writes
   html[data-theme] from Settings › General › Theme (System / Light / Dark).
   Colour themes other than Sunset (codex-app.css) still tint the window: their
   selectors are more specific than these and keep winning, on purpose.

   Specificity note: codex.css uses html[data-theme=light] and
   html:not([data-theme=light]); the rules below use the same selectors and load
   later (main.jsx), so they win without !important. */

:root {
  /* Type */
  --v2-font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --v2-read: ui-serif, "Iowan Old Style", "Charter", "Source Serif 4", Georgia, "Times New Roman", serif;
  --v2-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  /* Type scale (px at text size Default; Settings › Display › Text size scales --ns-text). 12px is the floor. */
  --v2-fs-min: calc(12px * var(--ns-text, 1));
  --v2-fs-xs: calc(12px * var(--ns-text, 1));
  --v2-fs-sm: calc(12.5px * var(--ns-text, 1));
  --v2-fs-ui: calc(13.5px * var(--ns-text, 1));
  --v2-fs-body: calc(14px * var(--ns-text, 1));
  --v2-fs-md: calc(15px * var(--ns-text, 1));
  --v2-fs-read: calc(16px * var(--ns-text, 1));
  --v2-fs-lg: calc(17px * var(--ns-text, 1));
  --v2-fs-xl: calc(20px * var(--ns-text, 1));
  --v2-fs-2xl: calc(26px * var(--ns-text, 1));
  --v2-fs-hero: calc(32px * var(--ns-text, 1));
  --v2-lh: 1.5;
  --v2-lh-read: 1.65;
  /* Spacing (4px grid, scaled by Settings › Display › Density) */
  --v2-sp-1: calc(4px * var(--ns-density, 1));
  --v2-sp-2: calc(8px * var(--ns-density, 1));
  --v2-sp-3: calc(12px * var(--ns-density, 1));
  --v2-sp-4: calc(16px * var(--ns-density, 1));
  --v2-sp-5: calc(20px * var(--ns-density, 1));
  --v2-sp-6: calc(24px * var(--ns-density, 1));
  --v2-sp-8: calc(32px * var(--ns-density, 1));
  /* Radii (scaled by Settings › Display › Corners) */
  --v2-r-xs: calc(6px * var(--ns-corner, 1));
  --v2-r-sm: calc(8px * var(--ns-corner, 1));

}
async function scene(i, id) {
  var b = BEATS[i]; current = i; mark(i); trim(i);
  var fromEmpty = view === "empty";
  await typeInto(fromEmpty ? typedE : typedC, b.q, id);
  var sendBtn = document.getElementById(fromEmpty ? "sendE" : "sendC"); sendBtn.classList.add("go"); await wait(T.send, id);
  (fromEmpty ? typedE : typedC).textContent = ""; sendBtn.classList.remove("go");
  if (fromEmpty) { setView("chat"); }
  ttlEl.innerHTML = ic("chat") + TITLES[i]; nav(NAV[i]);
  if (fromEmpty) await wait(T.enter, id);
  add(esc(b.q), "u fade");
  var a = add('<p class="nc-activity nc-activity--live">' + BOLT + '<span>Checking <b>' + b.tools[0] + '</b><span class="dots3"><i></i><i></i><i></i></span></span></p>', "a fade"); await wait(T.think, id);
  var html = ""; for (var t = 0; t < b.tools.length; t++) { html += activity(b.tools[t], true); a.innerHTML = html + (t < b.tools.length - 1 ? activity(b.tools[t + 1], false) : ""); bottom(); await wait(T.tool, id); }
  var p = document.createElement("p"); p.className = "say fade"; p.textContent = b.say; a.appendChild(p); bottom(); await wait(T.say, id);
  if (b.card) {
    var st = document.createElement("div"); st.className = "nc-stack fade"; st.innerHTML = b.card; a.appendChild(st); bottom(); say(b.sr); await wait(T.card, id); bottom();
    await wait(T.holdCard, id);
  } else {
    /* Plain chat-text reply: the answer arrives as ordinary assistant text, no card. */
    for (var m = 0; m < b.more.length; m++) { var box = document.createElement("div"); box.className = "fade"; box.innerHTML = b.more[m]; a.appendChild(box); bottom(); await wait(T.more, id); }
    say(b.sr); await wait(T.holdText, id);
  }
}
function stat() {
  logEl.innerHTML = ""; typedE.textContent = ""; typedC.textContent = ""; setView("chat"); ttlEl.innerHTML = ic("chat") + "New chat"; nav("new");
  BEATS.forEach(function (b, k) { current = k; add(esc(b.q), "u"); add(b.tools.map(function (t) { return activity(t, true); }).join("") + '<p class="say">' + b.say + '</p>' + (b.card ? '<div class="nc-stack">' + b.card + '</div>' : b.more.join("")), "a"); });
  srEl.textContent = ""; logEl.removeAttribute("aria-hidden"); logEl.tabIndex = 0; logEl.setAttribute("role", "region"); logEl.setAttribute("aria-label", "Demo conversation, all six scenes (scrollable)"); logEl.scrollTop = 0;
}
async function play(from) {
  var id = ++runId; srEl.textContent = "";
  if (reduce) { document.documentElement.classList.add("static"); stat(); return; }
  try {
    var i = from || 0, first = true;
    while (id === runId) {
      if (i === 0) { await showEmpty(id, first ? T.emptyFirst : T.emptyLoop); } else if (first) { logEl.innerHTML = ""; setView("chat"); }
      first = false;
      for (; i < BEATS.length; i++) await scene(i, id);
      i = 0; await wait(T.loopEnd, id);
    }
  } catch (err) { /* a newer run replaced this one */ }
}
BEATS.forEach(function (b, k) { var btn = document.createElement("button"); btn.type = "button"; btn.setAttribute("aria-label", "Scene " + (k + 1) + " of " + BEATS.length + ": " + LABELS[k]); btn.innerHTML = '<i></i>' + LABELS[k]; btn.addEventListener("click", function () { hold("hover", false); play(k); }); dotsEl.appendChild(btn); });
var rp = document.createElement("button"); rp.type = "button"; rp.className = "rp"; rp.setAttribute("aria-label", "Restart the demo from the first scene"); rp.textContent = "↻ Replay"; rp.addEventListener("click", function () { hold("hover", false); play(0); }); dotsEl.appendChild(rp);

if (!qs0.get("nohover")) [winEl].forEach(function (zone) { zone.addEventListener("mousemove", function () { if (!holds.hover) hold("hover", true); }); zone.addEventListener("mouseleave", function () { hold("hover", false); }); });
dotsEl.addEventListener("mouseenter", function () { hold("hover", false); });
/* scale the fixed-size app to the frame; phones get a sidebar-less, narrower layout */
function fit() {
  var w = window.innerWidth, h = window.innerHeight, compact = w < 600, W = compact ? 440 : 960, s = (w - 16) / W, H = (h - 8 - 34 - 6) / s;
  document.documentElement.classList.toggle("compact", compact);
  var f = document.getElementById("fit"); f.style.width = W + "px"; f.style.height = H + "px"; f.style.transform = "scale(" + s + ")";
  document.documentElement.style.setProperty("--s", s);
}
window.addEventListener("resize", fit); fit();
window.addEventListener("message", function (ev) {
  var d = ev.data || {};
  if (d.type === "ns-theme") { document.documentElement.setAttribute("data-page", d.theme === "dark" ? "dark" : "light"); document.documentElement.style.colorScheme = d.theme === "dark" ? "dark" : "light"; var r = document.documentElement.style; ["--v2-accent", "--v2-accent-text", "--v2-accent-ink", "--v2-accent-soft"].forEach(function (k) { if (d.vars && d.vars[k]) r.setProperty(k, d.vars[k]); else r.removeProperty(k); }); }
  if (d.type === "ns-visible") hold("offscreen", !d.on);
});
document.documentElement.setAttribute("data-theme", "dark");
document.documentElement.setAttribute("data-page", (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
document.documentElement.style.colorScheme = document.documentElement.getAttribute("data-page");
var qs = new URLSearchParams(location.search); if (qs.get("page") === "dark") document.documentElement.setAttribute("data-page", "dark");
setView("empty");
if (qs.get("scene")) { play(Number(qs.get("scene"))); } else play(0);
