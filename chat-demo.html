<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northstar chat demo (animation with demo data)</title>
<style>/* Action cards — GENERATED from the approved design kit (preview/action-cards/kit.css)
   by scripts/port-action-cards-css.mjs. Don't edit by hand: change the kit and
   re-run the porter. App-only additions: src/cards/action-cards-app.css. */
/* ==========================================================================
   Northstar action cards — design kit  (kit.css)
   Prefix: nc-   ·   Dark is default, light via <html data-theme="light">
   Chat column width via --col (kit.js sets it from ?w=720|400)
   DO NOT EDIT from area pages. One-off parts go in a page <style> with nc-x-.
   ========================================================================== */

/* ---------- 1. Tokens ---------- */
:root{
  --card:#212122;
  --card-hd:#212122;
  --inset:rgba(255,255,255,.035);
  --inset2:rgba(255,255,255,.06);
  --line3:rgba(255,255,255,.2);
  --ok-soft:rgba(74,222,128,.12);
  --warn-soft:rgba(255,179,64,.12);
  --del-soft:rgba(255,107,107,.12);
  --info:#6aa8ff;
  --info-soft:rgba(106,168,255,.12);
  --btn-pri-bg:#f2f2f2;
  --btn-pri-fg:#141414;
  --btn-pri-hover:#ffffff;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.18);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px rgba(122,99,255,.75);
  --r-card:18px;
  --r-inner:12px;
  --r-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
}
html[data-theme="light"]{
  --card:#ffffff;
  --card-hd:#ffffff;
  --inset:rgba(0,0,0,.025);
  --inset2:rgba(0,0,0,.045);
  --line3:rgba(0,0,0,.22);
  --ok-soft:rgba(22,163,74,.1);
  --warn-soft:rgba(217,119,6,.11);
  --del-soft:rgba(220,38,38,.08);
  --info:#1d64d8;
  --info-soft:rgba(29,100,216,.08);
  --btn-pri-bg:#161618;
  --btn-pri-fg:#ffffff;
  --btn-pri-hover:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px rgba(91,63,224,.6);
}

/* Class colours — ONE colour per class, used everywhere (chips, calendar blocks, bars, dots).
   Put data-class="engl|eco|hist|chem|math" on the element. Neutral items never use these.
   In the real app the colour comes from each class's colour in Northstar. */
:root{
  --nc-class-engl:#a566f2;
  --nc-class-eco:#3b8eea;
  --nc-class-hist:#e8832a;
  --nc-class-chem:#14b8a6;
  --nc-class-math:#ec4e87;
}
html[data-theme="light"]{
  --nc-class-engl:#8a3fe0;
  --nc-class-eco:#1d6fd1;
  --nc-class-hist:#c2620c;
  --nc-class-chem:#0b8577;
  --nc-class-math:#d02a66;
}
[data-class="engl"]{--app:var(--nc-class-engl)}
[data-class="eco"]{--app:var(--nc-class-eco)}
[data-class="hist"]{--app:var(--nc-class-hist)}
[data-class="chem"]{--app:var(--nc-class-chem)}
[data-class="math"]{--app:var(--nc-class-math)}

/* App colours — put data-app="…" on a card, chip or icon.  */
[data-app]{--app:#7a63ff}
[data-app="canvas"]{--app:#e03e2d}
[data-app="outlook"],[data-app="email"]{--app:#0a64ad}
[data-app="calendar"]{--app:#4f8ef7}
[data-app="files"],[data-app="syllabus"]{--app:#64748b}
[data-app="grades"]{--app:#1f9d55}
[data-app="studio"]{--app:#8b5cf6}
[data-app="study"]{--app:#d9468f}
[data-app="mysmu"],[data-app="degree"]{--app:#354ca1}
[data-app="coach"]{--app:#7a63ff}
[data-app="warn"]{--app:#e38a0c}
[data-app="danger"]{--app:#e5484d}
[data-app="focus"]{--app:#f07a1a}
[data-app="goals"]{--app:#0d9f94}
[data-app="library"]{--app:#a86b1f}
[data-app="announce"]{--app:#e8590c}
[data-app="campus"]{--app:#cc0035}
[data-app="settings"],[data-app="mac"]{--app:#6b6b73}
[data-app="chrome"]{--app:#1a73e8}
[data-app="today"]{--app:#f59e0b}

/* ---------- 2. Base & page chrome ---------- */
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt),:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *,:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *::before,:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *::after{box-sizing:border-box}
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) [hidden]{display:none!important}
.nc-card{font:15px/1.55 var(--font);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;text-align:left;letter-spacing:normal}
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) :is(button,input,textarea){font:inherit;color:inherit}
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) button{cursor:pointer}
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) a{color:var(--accent-text)}
:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) :focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.nc-ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.nc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nc-mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.nc-num-t{font-variant-numeric:tabular-nums}

.nc-page{max-width:1080px;margin:0 auto;padding:72px 28px 40px}
.nc-pagehead{max-width:var(--nc-col,720px);margin:0 auto 34px}
.nc-back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-size:13.5px;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:8px;transition:color .15s,background .15s}
.nc-back:hover{color:var(--text);background:var(--inset2)}
.nc-eyebrow{display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:var(--mute);font-size:13px;font-weight:500;letter-spacing:.01em}
.nc-h1{font-size:30px;line-height:1.15;letter-spacing:-.022em;font-weight:680;margin:0 0 10px}
.nc-lede{color:var(--t2);font-size:15.5px;line-height:1.6;margin:0;max-width:620px}
.nc-count{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--inset2);border:1px solid var(--line);color:var(--t2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;vertical-align:5px;margin-left:6px}
.nc-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;color:var(--mute);font-size:12.5px}
.nc-legend span{display:inline-flex;align-items:center;gap:6px}

.nc-section{max-width:var(--nc-col,720px);margin:0 auto 64px}
.nc-h2{font-size:20px;letter-spacing:-.015em;font-weight:650;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.nc-h2 .nc-appicon{--s:26px}
.nc-caption{color:var(--mute);font-size:14px;margin:0 0 22px;line-height:1.5}

/* Use-case label (above each worked example) */
.nc-uc{max-width:var(--nc-col,720px);margin:0 auto 56px}
.nc-uc-cap{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px dashed var(--line2)}
.nc-uc-cap b{font-size:14.5px;font-weight:650;letter-spacing:-.005em}
.nc-uc-cap .nc-uc-id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.nc-uc-cap p{flex-basis:100%;margin:2px 0 0;color:var(--mute);font-size:13px}
.nc-tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--inset2);color:var(--t2);border:1px solid var(--line);white-space:nowrap}
.nc-tag--star{background:rgba(245,176,34,.13);color:#f5c451;border-color:rgba(245,176,34,.3)}
html[data-theme="light"] .nc-tag--star{color:#8a5a00;background:rgba(245,176,34,.16);border-color:rgba(200,140,20,.35)}

/* State strip: label each state of a card ("1 · Needs your OK", "2 · After Send") */
.nc-state-label{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px}
.nc-state-label::after{content:"";flex:1;height:1px;background:var(--line)}
.nc-state-label:first-child{margin-top:0}

.nc-foot{max-width:var(--nc-col,720px);margin:40px auto 0;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- 3. Page toolbar (theme / width / replay) ---------- */
.nc-toolbar{position:fixed;top:14px;right:14px;z-index:50;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line2);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.nc-seg{display:flex;background:var(--inset2);border-radius:999px;padding:2px}
.nc-seg button,.nc-toolbar>button{border:0;background:transparent;color:var(--mute);height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:550;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.nc-seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
.nc-toolbar>button:hover,.nc-seg button:hover{color:var(--text)}
.nc-toolbar .nc-ic{width:14px;height:14px}

/* ---------- 4. Chat frame ---------- */
.nc-chat{max-width:var(--nc-col,720px);margin:0 auto;display:flex;flex-direction:column;container-type:inline-size;container-name:chat}
.nc-chat>*+*{margin-top:14px}
.nc-chat--panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.nc-user{align-self:flex-end;max-width:78%;background:var(--raise2);color:var(--text);border-radius:20px;padding:10px 16px;font-size:15px;line-height:1.5;margin-bottom:6px}
html[data-theme="light"] .nc-user{background:#f0f0f2}
.nc-coach{font-size:15px;line-height:1.65;color:var(--text);margin:0}
.nc-coach+.nc-coach{margin-top:8px}
.nc-coach b{font-weight:620}
.nc-coach code{font-family:var(--mono);font-size:.86em;background:var(--inset2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.nc-chat>.nc-coach{margin-top:18px}
.nc-chat>.nc-user+.nc-coach,.nc-chat>.nc-user+.nc-activity,.nc-chat>.nc-user+.nc-thinking{margin-top:10px}

/* ⚡ Using Gmail */
.nc-activity{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:15px;line-height:1.3;margin-top:22px!important;margin-bottom:-2px;padding-left:1px}
.nc-activity .nc-ic{width:17px;height:17px;color:var(--faint);stroke-width:1.6}
.nc-activity b{color:var(--t2);font-weight:620}
.nc-activity .nc-activity-sub{color:var(--faint);font-size:13px;margin-left:auto}
.nc-activity--live b{background:linear-gradient(90deg,var(--t2) 0%,var(--t2) 35%,var(--faint) 50%,var(--t2) 65%,var(--t2) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nc-shimmer-text 1.8s linear infinite}

/* Thinking panel */
.nc-thinking{border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:16px;padding:14px 18px 16px;background:color-mix(in srgb,var(--accent) 3%,var(--bg));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent)}
.nc-thinking-hd{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--t2)}
.nc-thinking-hd .nc-time{margin-left:auto;color:var(--mute);font-size:13.5px;font-variant-numeric:tabular-nums}
.nc-thinking-next{margin:10px 0 0 28px;color:var(--faint);font-size:14px}
.nc-thinking-next i{display:inline-block;width:7px;height:15px;background:color-mix(in srgb,var(--accent) 60%,transparent);border-radius:1px;vertical-align:-2px;margin-left:3px;animation:nc-caret 1s steps(1) infinite}
.nc-thinking.is-done{border-color:var(--line);box-shadow:none;background:transparent;padding:10px 16px}
.nc-thinking.is-done .nc-thinking-hd{font-size:14px;color:var(--mute)}
.nc-thinking.is-done .nc-time{font-size:13px;color:var(--faint)}

/* receipt pill: "2 files changed +412 −386" */
.nc-receipt{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--t2);font-size:14.5px;margin-top:22px!important;box-shadow:var(--shadow)}
.nc-receipt .nc-plus{color:var(--ok);font-variant-numeric:tabular-nums}
.nc-receipt .nc-minus{color:var(--del);font-variant-numeric:tabular-nums}
.nc-receipt .nc-dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.nc-receipt .nc-ic{width:15px;height:15px;color:var(--ok)}

/* tool chips + composer */
.nc-dock{margin-top:30px!important}
.nc-toolchips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);padding:1px}
.nc-toolchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--t2);font-size:13.5px;white-space:nowrap;flex:none;transition:background .15s,border-color .15s}
.nc-toolchip:hover{background:var(--inset2)}
.nc-toolchip .nc-appicon{--s:20px;--r:6px}
.nc-toolchip .nc-appicon .nc-ic{width:12px;height:12px;stroke-width:2}
.nc-composer{margin-top:10px;min-height:56px;border-radius:22px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;padding:0 10px 0 20px;color:var(--faint);font-size:15px;gap:10px}
.nc-composer span{flex:1}
.nc-composer button{width:34px;height:34px;border-radius:50%;border:0;background:var(--btn-pri-bg);color:var(--btn-pri-fg);display:grid;place-items:center}

/* ---------- 5. Card shell ---------- */
.nc-card{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
html[data-theme="light"] .nc-card{border-color:rgba(0,0,0,.11)}
.nc-card-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:64px;background:var(--card-hd);border-bottom:1px solid var(--line);position:relative}
.nc-card[data-collapsed="true"] .nc-card-hd{border-bottom-color:transparent}
.nc-appicon{--s:32px;--r:9px;width:var(--s);height:var(--s);border-radius:var(--r);flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--app) 86%,#fff) 0%,var(--app) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.25)}
.nc-appicon .nc-ic{width:17px;height:17px;stroke-width:1.9}
.nc-appicon--lg{--s:44px;--r:12px}
.nc-appicon--lg .nc-ic{width:22px;height:22px}
.nc-appicon--sm{--s:22px;--r:6px}
.nc-appicon--sm .nc-ic{width:13px;height:13px;stroke-width:2}
.nc-card-ttl{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.nc-card-ttl b{font-size:15.5px;font-weight:620;letter-spacing:-.008em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-card-ttl span{font-size:13.5px;color:var(--mute);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-card-bd{padding:16px 18px 18px}
.nc-card-bd+.nc-actions{padding-top:0;margin-top:-2px}
.nc-card .nc-card-bd>*+*{margin-top:14px}
.nc-text{font-size:15px;line-height:1.6;color:var(--text);margin:0}
.nc-text-2{font-size:14px;line-height:1.55;color:var(--t2);margin:0}
.nc-meta{font-size:13px;color:var(--mute);line-height:1.45}
.nc-hr{height:1px;background:var(--line);border:0;margin:14px 0}
.nc-card-ft{display:flex;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid var(--line);background:var(--inset);color:var(--mute);font-size:12.5px}
.nc-card-ft .nc-ic{width:14px;height:14px}
.nc-card-ft .nc-right{margin-left:auto}

/* Working card: animated hairline under the header + soft sheen */
.nc-card[data-status="working"] .nc-card-hd::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 0%,var(--accent-text) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat;animation:nc-scan 1.6s var(--ease) infinite}
.nc-card[data-status="working"]::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,color-mix(in srgb,var(--text) 3.5%,transparent) 50%,transparent 65%);background-size:250% 100%;animation:nc-sheen 2.4s linear infinite}

/* Collapse / expand (JS toggles data-collapsed on .nc-card) */
.nc-collapse{border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;margin-right:-6px;transition:background .15s,color .15s}
.nc-collapse:hover{background:var(--inset2);color:var(--text)}
.nc-collapse .nc-ic{transition:transform .3s var(--ease)}
.nc-card[data-collapsed="true"] .nc-collapse .nc-ic{transform:rotate(-90deg)}
.nc-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s var(--ease),opacity .3s}
.nc-fold>.nc-fold-in{min-height:0;overflow:hidden}
.nc-card[data-collapsed="true"] .nc-fold{grid-template-rows:0fr;opacity:0}

/* ---------- 6. Status (far right of header) ---------- */
.nc-status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--mute);flex:none}
.nc-status .nc-ic{width:16px;height:16px;stroke-width:2}
.nc-status--done{color:var(--ok)}
.nc-status--done .nc-ic path{stroke-dasharray:24;stroke-dashoffset:0;animation:nc-draw .5s .1s var(--ease) both}
.nc-status--needs{color:var(--accent-text)}
.nc-status--needs::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent);animation:nc-pulse 2s infinite}
.nc-status--working{color:var(--t2)}
.nc-status--waiting{color:var(--mute)}
.nc-status--heads{color:var(--warn)}
.nc-status--failed{color:var(--del)}
.nc-status--info{color:var(--mute)}
.nc-status--live{color:var(--ok)}
.nc-status--live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:nc-pulse-ok 2s infinite}
.nc-spin{width:16px;height:16px;flex:none;border-radius:50%;border:1.75px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:nc-rot .8s linear infinite}
.nc-spin--lg{width:18px;height:18px;border-width:2px}

/* ---------- 7. Buttons (pills) ---------- */
.nc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 18px 18px}
.nc-actions .nc-meta{margin-left:auto}
.nc-actions-note{flex-basis:100%;display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-top:4px}
.nc-actions-note .nc-ic{width:13px;height:13px}
.nc-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--line3);background:transparent;color:var(--text);font-size:14.5px;font-weight:500;letter-spacing:-.003em;white-space:nowrap;transition:background .16s,border-color .16s,color .16s,transform .12s var(--ease),opacity .2s;user-select:none}
.nc-btn:hover{background:var(--inset2);border-color:color-mix(in srgb,var(--text) 32%,transparent)}
.nc-btn:active{transform:scale(.965)}
.nc-btn .nc-ic{width:15px;height:15px}
.nc-btn--primary{background:var(--btn-pri-bg);border-color:var(--btn-pri-bg);color:var(--btn-pri-fg);font-weight:560}
.nc-btn--primary:hover{background:var(--btn-pri-hover);border-color:var(--btn-pri-hover)}
.nc-btn--danger{color:var(--del);border-color:color-mix(in srgb,var(--del) 38%,transparent)}
.nc-btn--danger:hover{background:var(--del-soft);border-color:color-mix(in srgb,var(--del) 55%,transparent)}
.nc-btn--primary.nc-btn--danger{background:var(--del);border-color:var(--del);color:#fff}
.nc-btn--ghost{border-color:transparent;color:var(--mute);padding:0 12px}
.nc-btn--ghost:hover{color:var(--text);background:var(--inset2);border-color:transparent}
.nc-btn--sm{height:30px;padding:0 13px;font-size:13px;gap:6px}
.nc-btn--sm .nc-ic{width:13px;height:13px}
.nc-btn--icon{width:38px;padding:0}
.nc-btn--sm.nc-btn--icon{width:30px}
.nc-btn[disabled],.nc-btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.nc-btn[data-busy]{pointer-events:none}
.nc-btn[data-busy] .nc-spin{width:14px;height:14px}
.nc-kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:0 4px;margin-left:2px}

/* Inline "after" row that replaces the buttons once done (receipt line) */
.nc-after{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:0 18px 18px;color:var(--mute);font-size:13.5px;animation:nc-rise .35s var(--ease) both}
.nc-after .nc-ic{width:15px;height:15px;color:var(--ok)}
.nc-after b{color:var(--t2);font-weight:560}
.nc-after .nc-btn{margin-left:auto}
.nc-after .nc-btn+.nc-btn{margin-left:0}

/* ---------- 8. Small parts: badges, chips, avatars, kv ---------- */
.nc-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--inset2);color:var(--t2);border:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.nc-badge .nc-ic{width:12px;height:12px;stroke-width:2.1}
.nc-badge--posted{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.nc-badge--estimate{background:transparent;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent)}
.nc-badge--live{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.nc-badge--live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.nc-badge--accent{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.nc-badge--warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.nc-badge--del{background:var(--del-soft);color:var(--del);border-color:transparent}
.nc-badge--info{background:var(--info-soft);color:var(--info);border-color:transparent}
.nc-badge--app{background:color-mix(in srgb,var(--app) 16%,transparent);color:color-mix(in srgb,var(--app) 70%,var(--text));border-color:transparent}
.nc-class{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--t2);white-space:nowrap}
.nc-class::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--app,var(--accent))}

.nc-avatars{display:flex;align-items:center;flex:none}
.nc-av{--c:#6b6b73;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c);border:2px solid var(--card);margin-left:-8px;letter-spacing:.01em}
.nc-av:first-child{margin-left:0}
.nc-av--sm{width:24px;height:24px;font-size:9.5px;margin-left:-6px}
.nc-av--lg{width:44px;height:44px;font-size:15px}

.nc-kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;font-size:14px;margin:0}
.nc-kv dt{color:var(--mute)}
.nc-kv dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}

.nc-inset{background:var(--inset);border:1px solid var(--line);border-radius:var(--r-inner);padding:14px 16px}
.nc-row{display:flex;align-items:center;gap:10px;min-width:0}
.nc-grow{flex:1;min-width:0}

/* Source line: where a fact came from (Syllabus p.3 · Open) */
.nc-src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);min-width:0}
.nc-src .nc-ic{width:14px;height:14px}
.nc-src b{color:var(--t2);font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-pagechip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:var(--inset2);border:1px solid var(--line2);color:var(--t2);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
button.nc-pagechip:hover,a.nc-pagechip:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-text)}
.nc-pagechip .nc-ic{width:12px;height:12px}

/* Callout (inline heads-up inside any body) */
.nc-callout{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-inner);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 22%,transparent);color:var(--text);font-size:14px;line-height:1.5}
.nc-callout>.nc-ic{width:18px;height:18px;color:var(--warn);margin-top:1px}
.nc-callout--danger{background:var(--del-soft);border-color:color-mix(in srgb,var(--del) 25%,transparent)}
.nc-callout--danger>.nc-ic{color:var(--del)}
.nc-callout--info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.nc-callout--info>.nc-ic{color:var(--info)}
.nc-callout--ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.nc-callout--ok>.nc-ic{color:var(--ok)}
.nc-callout b{font-weight:620}

/* ---------- 9. Week strip ---------- */
.nc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nc-day{position:relative;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text);transition:background .2s,border-color .2s}
.nc-day:hover{background:var(--inset)}
.nc-day-name{font-size:13px;color:var(--mute)}
.nc-day-num{font-size:20px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.nc-day-load{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;margin-top:7px}
.nc-day-load i{display:block;height:3px;border-radius:2px;background:var(--line2);width:84%}
.nc-day-load i+i{width:56%}
.nc-day-load i.is-app{background:color-mix(in srgb,var(--app,var(--accent)) 70%,transparent)}
.nc-day[aria-selected="true"],.nc-day.is-sel{background:var(--inset2);border-color:var(--line2)}
.nc-day[aria-selected="true"] .nc-day-load i:first-child,.nc-day.is-sel .nc-day-load i:first-child{background:var(--app,var(--info));height:4px}
.nc-day.is-today .nc-day-num{color:var(--accent-text)}
.nc-day.is-past{opacity:.55}
.nc-day-dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--app,var(--accent))}

/* ---------- 10. Event row ---------- */
.nc-event{--c:var(--app,var(--info));position:relative;display:flex;align-items:center;gap:16px;padding:13px 16px 13px 20px;border-radius:var(--r-inner);background:color-mix(in srgb,var(--c) 11%,var(--card));overflow:hidden;min-width:0}
html[data-theme="light"] .nc-event{background:color-mix(in srgb,var(--c) 7%,#fff)}
.nc-event::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);border-radius:4px 0 0 4px}
.nc-event+.nc-event{margin-top:8px}
.nc-date{display:flex;flex-direction:column;align-items:center;min-width:34px;flex:none;line-height:1}
.nc-date small{font-size:11.5px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;font-weight:550}
.nc-date b{font-size:24px;font-weight:620;margin-top:4px;font-variant-numeric:tabular-nums}
.nc-event-main{flex:1;min-width:0}
.nc-event-main b{display:block;font-size:15.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-event-main span{display:block;font-size:13.5px;color:var(--t2);line-height:1.45;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-event--compact{padding:9px 12px 9px 16px;gap:12px}
.nc-event--compact .nc-date b{font-size:18px}
.nc-event--ghost{background:transparent;border:1px dashed var(--line3)}
.nc-event--ghost::before{background:repeating-linear-gradient(180deg,var(--c) 0 5px,transparent 5px 9px)}
.nc-event.is-struck .nc-event-main b{text-decoration:line-through;text-decoration-color:var(--del);color:var(--mute)}

/* Mini day timeline: hour rail + absolutely placed blocks.
   <div class="nc-timeline" style="--hours:6"> hour rows (.nc-tl-h) + blocks with style="--at:1.5;--len:1" (hours from the first row) */
.nc-timeline{--hh:36px;position:relative;padding-left:50px;height:calc(var(--hours,6) * var(--hh))}
.nc-tl-h{height:var(--hh);border-top:1px solid var(--line);position:relative}
.nc-tl-h span{position:absolute;left:-50px;width:40px;text-align:right;top:-8px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nc-tl-block{--c:var(--app,var(--accent));position:absolute;left:54px;right:0;top:calc(var(--at) * var(--hh) + 2px);height:calc(var(--len) * var(--hh) - 4px);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:560;line-height:1.3;background:color-mix(in srgb,var(--c) 17%,var(--card));box-shadow:inset 3px 0 0 var(--c);color:var(--text);overflow:hidden;z-index:1;display:flex;flex-direction:column;justify-content:center;transition:opacity .3s,transform .3s var(--ease)}
.nc-tl-block small{display:block;color:var(--mute);font-size:11.5px;font-weight:450}
.nc-tl-block.is-fixed{--c:var(--faint);background:var(--inset2);color:var(--t2)}
.nc-tl-block.is-fixed[data-class]{--c:var(--app)}
.nc-tl-block.is-new{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--card)) 0 7px,color-mix(in srgb,var(--c) 10%,var(--card)) 7px 14px);outline:1px dashed color-mix(in srgb,var(--c) 60%,transparent);outline-offset:-1px}
.nc-tl-block.is-off{opacity:.25}
.nc-tl-now{position:absolute;left:44px;right:0;top:calc(var(--at) * var(--hh));border-top:1.5px solid var(--del);z-index:2}
.nc-tl-now::before{content:"";position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--del)}

/* ---------- 11. Email ---------- */
.nc-mail-grid{display:grid;grid-template-columns:max-content 1fr;gap:5px 28px;font-size:14.5px;margin:0;padding-bottom:14px;border-bottom:1px solid var(--line)}
.nc-mail-grid dt{color:var(--mute)}
.nc-mail-grid dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.nc-mail-grid dd small{color:var(--mute);font-size:13px}
.nc-mail-body{font-size:15px;line-height:1.7;color:var(--text);white-space:pre-line}
.nc-mail-body[contenteditable="true"]{outline:none;border-radius:10px;box-shadow:0 0 0 1px var(--line2);padding:10px 12px;margin-left:-12px;margin-right:-12px;background:var(--inset)}
.nc-mail-body[contenteditable="true"]:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}
.nc-attach{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 16px 0 14px;border-radius:12px;border:1px solid var(--line2);color:var(--t2);font-size:14px;background:transparent;max-width:100%}
.nc-attach .nc-ic{width:16px;height:16px;color:var(--mute)}
.nc-attach small{color:var(--mute)}
.nc-attachments{display:flex;flex-wrap:wrap;gap:8px}
/* daily cap meter: "3 of 20 today" */
.nc-cap{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.nc-cap-bar{position:relative;width:54px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.nc-cap-bar i{position:absolute;inset:0 auto 0 0;width:calc(var(--v) * 1%);background:var(--mute);border-radius:3px;transition:width .6s var(--ease)}
.nc-cap.is-high .nc-cap-bar i{background:var(--warn)}
.nc-cap.is-high{color:var(--warn)}
/* mail list rows (digest / thread) */
.nc-mails{display:flex;flex-direction:column}
.nc-mailrow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.nc-mailrow:first-child{border-top:0;padding-top:0}
.nc-mailrow .nc-av{margin:0;border:0;width:32px;height:32px}
.nc-mailrow-main{flex:1;min-width:0}
.nc-mailrow-top{display:flex;align-items:baseline;gap:8px}
.nc-mailrow-top b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-mailrow-top time{margin-left:auto;font-size:12.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.nc-mailrow-sub{font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-mailrow-prev{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 12. Checklist (pick-and-approve) ---------- */
.nc-checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-inner);overflow:hidden}
.nc-check{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line);transition:background .15s;min-width:0}
.nc-check:first-child{border-top:0}
.nc-check:hover{background:var(--inset)}
.nc-check input{position:absolute;opacity:0;pointer-events:none}
.nc-box{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid var(--line3);display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s var(--ease-spring);color:var(--btn-pri-fg)}
.nc-box svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .28s var(--ease) .05s}
.nc-check input:checked+.nc-box{background:var(--text);border-color:var(--text)}
html[data-theme="light"] .nc-check input:checked+.nc-box{background:var(--text);border-color:var(--text);color:#fff}
.nc-check input:checked+.nc-box svg{stroke-dashoffset:0}
.nc-check input:active+.nc-box{transform:scale(.88)}
.nc-check input:focus-visible+.nc-box{box-shadow:var(--focus)}
.nc-check-main{flex:1;min-width:0}
.nc-check-main b{display:block;font-size:14.5px;font-weight:560;line-height:1.35;transition:color .2s}
.nc-check-main span{display:block;font-size:13px;color:var(--mute);line-height:1.4;margin-top:1px}
.nc-check-when{flex:none;text-align:right;font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.nc-check-when small{display:block;color:var(--mute);font-size:12px}
.nc-check:has(input:not(:checked)) .nc-check-main b{color:var(--mute)}
.nc-check.is-done .nc-check-main b{text-decoration:line-through;color:var(--mute)}
.nc-checks-hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute)}
.nc-checks-hd button{border:0;background:none;color:var(--accent-text);font-size:13px;padding:2px 4px;border-radius:6px}
/* readonly result/ checklist state marks */
.nc-mark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center}
.nc-mark .nc-ic{width:12px;height:12px;stroke-width:2.8}
.nc-mark--ok{background:var(--ok-soft);color:var(--ok)}
.nc-mark--no{background:var(--del-soft);color:var(--del)}
.nc-mark--warn{background:var(--warn-soft);color:var(--warn)}
.nc-mark--todo{border:1.5px dashed var(--line3)}

/* ---------- 13. Choice: option rows + chips ---------- */
.nc-options{display:flex;flex-direction:column;gap:8px}
.nc-option{position:relative;display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:13px 16px;border-radius:var(--r-inner);border:1px solid var(--line2);background:transparent;color:var(--text);transition:border-color .18s,background .18s,box-shadow .18s,transform .12s}
.nc-option:hover{background:var(--inset);border-color:var(--line3)}
.nc-option:active{transform:scale(.992)}
.nc-option-key{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mute);background:var(--inset2);transition:background .18s,color .18s}
.nc-option-key .nc-ic{width:15px;height:15px}
.nc-option-main{flex:1;min-width:0}
.nc-option-main b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.nc-option-main span{display:block;font-size:13.5px;color:var(--mute);line-height:1.45;margin-top:2px}
.nc-option-side{flex:none;align-self:center;font-size:12.5px;color:var(--mute);white-space:nowrap}
.nc-option[aria-checked="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:var(--accent-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent) inset}
.nc-option[aria-checked="true"] .nc-option-key{background:var(--accent);color:#fff}
.nc-option-main .nc-option-tag,.nc-option-tag{display:inline-flex;margin-top:0;margin-left:6px;height:19px;align-items:center;padding:0 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:11px;font-weight:650;vertical-align:1px;letter-spacing:.01em}
.nc-choicechips{display:flex;flex-wrap:wrap;gap:8px}
.nc-choicechip{height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--t2);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:all .16s}
.nc-choicechip:hover{border-color:var(--line3);color:var(--text)}
.nc-choicechip[aria-checked="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 65%,transparent);color:var(--accent-text)}
.nc-choicechip .nc-ic{width:14px;height:14px}
/* side-by-side compare (e.g., double-booked) */
.nc-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.nc-vs-mid{display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.05em}

/* ---------- 14. Live steps + progress ---------- */
.nc-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.nc-step{position:relative;display:flex;align-items:flex-start;gap:14px;padding:7px 0;font-size:14.5px;line-height:1.45;color:var(--text);transition:color .3s}
.nc-step:not(:last-child)::after{content:"";position:absolute;left:10px;top:31px;bottom:-5px;width:1.5px;background:var(--line2);transition:background .4s}
.nc-step[data-state="done"]:not(:last-child)::after{background:color-mix(in srgb,var(--ok) 45%,transparent)}
.nc-step-ic{position:relative;width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line3);background:var(--card);z-index:1;transition:border-color .3s,background .3s}
.nc-step-ic .nc-ic{width:12px;height:12px;stroke-width:3;color:var(--ok);opacity:0}
.nc-step-ic .nc-spin{width:22px;height:22px;position:absolute;inset:-1.5px;border-width:1.75px;color:var(--accent-text);opacity:0}
.nc-step[data-state="done"] .nc-step-ic{border-color:transparent;background:var(--ok-soft)}
.nc-step[data-state="done"] .nc-step-ic .nc-ic{opacity:1}
.nc-step[data-state="done"] .nc-step-ic .nc-ic path{stroke-dasharray:24;animation:nc-draw .45s var(--ease) both}
.nc-step[data-state="active"] .nc-step-ic{border-color:transparent}
.nc-step[data-state="active"] .nc-step-ic .nc-spin{opacity:1}
.nc-step[data-state="todo"]{color:var(--mute)}
.nc-step[data-state="failed"] .nc-step-ic{border-color:transparent;background:var(--del-soft)}
.nc-step[data-state="failed"] .nc-step-ic .nc-ic{opacity:1;color:var(--del)}
.nc-step[data-state="warn"] .nc-step-ic,.nc-step[data-state="failed"] .nc-step-ic{border-color:transparent;background:var(--warn-soft)}
.nc-step[data-state="failed"] .nc-step-ic{background:var(--del-soft)}
.nc-step[data-state="warn"] .nc-step-ic::after,.nc-step[data-state="failed"] .nc-step-ic::after{content:"!";color:var(--warn);font:800 12px/1 var(--font)}
.nc-step[data-state="failed"] .nc-step-ic::after{content:"×";color:var(--del);font-size:15px}
.nc-step[data-state="warn"] .nc-step-main small{color:var(--warn)}
.nc-step-main{flex:1;min-width:0;padding-top:1px}
.nc-step-main small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.nc-step[data-state="active"] .nc-step-main>span{background:linear-gradient(90deg,var(--text) 0%,var(--text) 38%,var(--faint) 50%,var(--text) 62%,var(--text) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nc-shimmer-text 1.8s linear infinite}
.nc-step-time{flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.nc-progress{height:6px;border-radius:999px;background:var(--line2);overflow:hidden;position:relative}
.nc-progress i{position:absolute;inset:0 auto 0 0;width:calc(var(--v,0) * 1%);background:var(--app,var(--accent));border-radius:999px;transition:width .7s var(--ease)}
.nc-progress--ok i{background:var(--ok)}
.nc-progress-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.nc-progress-row .nc-progress{flex:1}
/* checklist results (ready-to-submit): row with mark + label + action */
.nc-results{display:flex;flex-direction:column;gap:2px}
.nc-result{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14.5px}
.nc-result .nc-grow span{display:block;font-size:13px;color:var(--mute)}
.nc-result.is-no b{color:var(--text)}

/* ---------- 15. Preview tile (thumbnail + title + meta) ---------- */
.nc-tile{display:flex;gap:20px;align-items:center;min-width:0}
.nc-thumb{--c:var(--app,var(--accent));position:relative;flex:none;width:236px;aspect-ratio:5/3.7;border-radius:12px;border:1px solid var(--line2);overflow:hidden;background:radial-gradient(120% 90% at 70% 70%,color-mix(in srgb,var(--c) 30%,transparent) 0%,transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,#15161a),#101114)}
html[data-theme="light"] .nc-thumb{background:radial-gradient(120% 90% at 70% 70%,color-mix(in srgb,var(--c) 20%,transparent) 0%,transparent 60%),linear-gradient(160deg,#fbfbfd,color-mix(in srgb,var(--c) 8%,#f1f1f4))}
.nc-thumb-lines{position:absolute;left:16px;right:16px;top:16px;display:flex;flex-direction:column;gap:7px}
.nc-thumb-lines i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.35);width:62%}
.nc-thumb-lines i:nth-child(2){width:88%;height:3px;background:rgba(255,255,255,.16)}
.nc-thumb-lines i:nth-child(n+3){width:78%;height:3px;background:rgba(255,255,255,.1)}
.nc-thumb-lines i:nth-child(4){width:84%}
.nc-thumb-lines i:nth-child(5){width:52%}
html[data-theme="light"] .nc-thumb-lines i{background:rgba(0,0,0,.22)}
html[data-theme="light"] .nc-thumb-lines i:nth-child(n+2){background:rgba(0,0,0,.09)}
.nc-thumb-glyph{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nc-thumb-glyph .nc-ic{width:18px;height:18px}
.nc-thumb-label{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:650;color:rgba(255,255,255,.75);letter-spacing:.04em;text-transform:uppercase}
html[data-theme="light"] .nc-thumb-label{color:rgba(0,0,0,.55)}
.nc-thumb--doc{aspect-ratio:3/3.6;width:150px;background:#f6f5f2}
html[data-theme="light"] .nc-thumb--doc{background:#fff}
.nc-thumb--doc .nc-thumb-lines i{background:rgba(0,0,0,.28)!important}
.nc-thumb--doc .nc-thumb-lines i:nth-child(n+2){background:rgba(0,0,0,.1)!important}
.nc-thumb--doc .nc-thumb-label{color:rgba(0,0,0,.5)}
.nc-thumb--sm{width:96px}
.nc-thumb--sm .nc-thumb-lines{left:10px;right:10px;top:10px;gap:5px}
.nc-tile-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.nc-tile-title{font-size:21px;font-weight:650;letter-spacing:-.015em;line-height:1.25;margin:4px 0 0}
.nc-url{font-family:var(--mono);font-size:13.5px;color:var(--t2);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.nc-tile-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--mute)}
.nc-tile-stats b{color:var(--text);font-weight:650;margin-left:6px;font-variant-numeric:tabular-nums}
/* compact list of preview rows (brief / digest) */
.nc-list{display:flex;flex-direction:column}
.nc-li{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.nc-li:first-child{border-top:0;padding-top:2px}
.nc-li:last-child{padding-bottom:0}
.nc-li-num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--inset2);color:var(--t2);font-variant-numeric:tabular-nums}
.nc-li-main{flex:1;min-width:0}
.nc-li-main b{display:block;font-size:14.5px;font-weight:580;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-li-main span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-li-side{flex:none;font-size:13px;color:var(--t2);text-align:right;white-space:nowrap}

/* ---------- 16. Diff (before/after) + old→new date ---------- */
.nc-diff{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-inner);overflow:hidden;font-size:14.5px;line-height:1.65}
.nc-diff-row{position:relative;padding:12px 16px 12px 44px;min-width:0}
.nc-diff-row+.nc-diff-row{border-top:1px solid var(--line)}
.nc-diff-row::before{position:absolute;left:16px;top:12px;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 13px/18px var(--mono);text-align:center}
.nc-diff-row--del{background:color-mix(in srgb,var(--del) 5%,transparent);color:var(--t2)}
.nc-diff-row--del::before{content:"−";color:var(--del);background:var(--del-soft)}
.nc-diff-row--add{background:color-mix(in srgb,var(--ok) 5%,transparent)}
.nc-diff-row--add::before{content:"+";color:var(--ok);background:var(--ok-soft)}
.nc-diff del{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--del) 70%,transparent);background:var(--del-soft);color:inherit;border-radius:4px;padding:0 2px}
.nc-diff ins{text-decoration:none;background:color-mix(in srgb,var(--ok) 18%,transparent);border-radius:4px;padding:0 2px}
.nc-diff-hd{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--inset);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.nc-diff-hd .nc-plus{color:var(--ok);font-variant-numeric:tabular-nums}
.nc-diff-hd .nc-minus{color:var(--del);font-variant-numeric:tabular-nums}
.nc-diff[data-view="after"] .nc-diff-row--del{display:none}
.nc-diff[data-view="after"] .nc-diff-row--add{padding-left:16px}
.nc-diff[data-view="after"] .nc-diff-row--add::before{display:none}
.nc-datechange{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nc-datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);line-height:1.1}
.nc-datebox small{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nc-datebox b{font-size:26px;font-weight:650;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.nc-datebox span{font-size:12px;color:var(--mute)}
.nc-datebox--old{opacity:.6;border-style:dashed}
.nc-datebox--old b{text-decoration:line-through;text-decoration-color:var(--del);text-decoration-thickness:2px}
.nc-datebox--new{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:var(--ok-soft)}
.nc-datebox--new small{color:var(--ok)}
.nc-arrow{color:var(--faint);display:grid;place-items:center}
.nc-arrow .nc-ic{width:20px;height:20px}
.nc-old{text-decoration:line-through;text-decoration-color:var(--del);color:var(--mute)}
.nc-new{color:var(--ok);font-weight:600}

/* ---------- 17. Alert (heads-up) ---------- */
.nc-card--alert{border-color:color-mix(in srgb,var(--warn) 30%,var(--line2))}
.nc-card--alert .nc-card-hd{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 7%,transparent),transparent 70%)}
.nc-card--danger{border-color:color-mix(in srgb,var(--del) 34%,var(--line2))}
.nc-card--danger .nc-card-hd{background:linear-gradient(90deg,color-mix(in srgb,var(--del) 8%,transparent),transparent 70%)}
.nc-alert-lead{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.4;margin:0}
.nc-alert-lead em{font-style:normal;color:var(--warn)}
.nc-card--danger .nc-alert-lead em{color:var(--del)}
.nc-flags{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.nc-flags li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--t2);line-height:1.45}
.nc-flags li .nc-ic{width:15px;height:15px;margin-top:2px;color:var(--del);flex:none}

/* ---------- 18. Stat (number card) ---------- */
.nc-stat{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.nc-stat-num{font-size:44px;line-height:1;font-weight:680;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.nc-stat-num small{font-size:22px;font-weight:600;color:var(--mute);letter-spacing:-.01em;margin-left:2px}
.nc-stat-lbl{font-size:13.5px;color:var(--mute);margin-bottom:4px}
.nc-stat-side{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-bottom:3px}
.nc-delta{display:inline-flex;align-items:center;gap:3px;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
.nc-delta .nc-ic{width:14px;height:14px;stroke-width:2.4}
.nc-delta--up{color:var(--ok)}
.nc-delta--down{color:var(--del)}
.nc-delta--flat{color:var(--mute)}
.nc-statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.nc-mini{padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);min-width:0}
.nc-mini small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-mini b{display:block;font-size:22px;font-weight:660;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-mini span{display:block;font-size:12.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-mini .nc-delta{display:flex}
.nc-mini .nc-delta--up{color:var(--ok)}
.nc-mini .nc-delta--down{color:var(--del)}
/* bars: label | track | value */
.nc-bars{display:flex;flex-direction:column;gap:12px}
.nc-bar{display:grid;grid-template-columns:minmax(80px,132px) 1fr auto;align-items:center;gap:14px;font-size:13.5px}
.nc-bar-lbl{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-bar-lbl small{color:var(--mute);margin-left:4px}
.nc-bar-track{position:relative;height:8px;border-radius:999px;background:var(--line2);overflow:hidden}
.nc-bar-track i{position:absolute;inset:0 auto 0 0;width:calc(var(--v) * 1%);border-radius:999px;background:var(--app,var(--accent));transform-origin:left;animation:nc-grow .9s var(--ease) both}
.nc-bar-track i.is-est{background:repeating-linear-gradient(135deg,var(--app,var(--accent)) 0 4px,color-mix(in srgb,var(--app,var(--accent)) 55%,transparent) 4px 8px)}
.nc-bar-track .nc-mark-line{position:absolute;top:-3px;bottom:-3px;width:2px;left:calc(var(--at) * 1%);background:var(--text);border-radius:1px;opacity:.7}
.nc-bar-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;text-align:right}
/* ring */
.nc-ring{--v:0;--size:92px;--stroke:8px;position:relative;width:var(--size);height:var(--size);flex:none}
.nc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.nc-ring circle{fill:none;stroke-width:var(--stroke);stroke-linecap:round}
.nc-ring .nc-ring-bg{stroke:var(--line2)}
.nc-ring .nc-ring-fg{stroke:var(--app,var(--accent));stroke-dasharray:100 100;stroke-dashoffset:calc(100 - var(--v));transition:stroke-dashoffset 1s var(--ease)}
.nc-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.nc-ring-c b{font-size:22px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nc-ring-c small{font-size:11px;color:var(--mute);margin-top:2px}
.nc-ring--sm{--size:56px;--stroke:6px}
.nc-ring--sm .nc-ring-c b{font-size:14px}
/* sparkline */
.nc-spark{width:100%;height:56px;display:block;overflow:visible}
.nc-spark .nc-spark-line{fill:none;stroke:var(--app,var(--accent));stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:nc-dash100 1.2s var(--ease) both}
.nc-spark .nc-spark-area{fill:color-mix(in srgb,var(--app,var(--accent)) 14%,transparent);stroke:none}
.nc-spark .nc-spark-dot{fill:var(--app,var(--accent));stroke:var(--card);stroke-width:2}
.nc-spark .nc-spark-est{fill:none;stroke:var(--app,var(--accent));stroke-width:2;stroke-dasharray:3 4;opacity:.7}
.nc-spark .nc-spark-grid{stroke:var(--line);stroke-width:1}
.nc-spark text{fill:var(--faint);font-size:10px;font-family:var(--font)}
.nc-legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.nc-legend-row span{display:inline-flex;align-items:center;gap:6px}
.nc-legend-row i{width:14px;height:3px;border-radius:2px;background:var(--app,var(--accent))}
.nc-legend-row i.is-est{background:repeating-linear-gradient(90deg,var(--app,var(--accent)) 0 3px,transparent 3px 6px)}

/* ---------- 19. Interactive: quiz, slider, flip card ---------- */
.nc-q{font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.45;margin:0}
.nc-q-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.nc-q-meta .nc-progress{flex:1;height:4px}
.nc-answers{display:flex;flex-direction:column;gap:8px}
.nc-answer{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 16px;border-radius:var(--r-inner);border:1px solid var(--line2);background:transparent;color:var(--text);font-size:14.5px;line-height:1.4;transition:border-color .2s,background .2s,opacity .3s,transform .12s}
.nc-answer:hover{background:var(--inset);border-color:var(--line3)}
.nc-answer:active{transform:scale(.992)}
.nc-answer .nc-option-key{width:24px;height:24px;font-size:12px;border-radius:7px}
.nc-answer .nc-ans-ic{margin-left:auto;width:18px;height:18px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--ease-spring)}
.nc-answers.is-revealed .nc-answer{pointer-events:none}
.nc-answers.is-revealed .nc-answer:not(.is-right):not(.is-wrong){opacity:.45}
.nc-answer.is-right{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:var(--ok-soft)}
.nc-answer.is-right .nc-option-key{background:var(--ok);color:#fff}
.nc-answer.is-right .nc-ans-ic{opacity:1;transform:none;color:var(--ok)}
.nc-answer.is-wrong{border-color:color-mix(in srgb,var(--del) 55%,transparent);background:var(--del-soft);animation:nc-shake .35s}
.nc-answer.is-wrong .nc-option-key{background:var(--del);color:#fff}
.nc-answer.is-wrong .nc-ans-ic{opacity:1;transform:none;color:var(--del)}
.nc-explain{display:none;gap:10px;padding:12px 14px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--t2)}
.nc-explain.is-shown{display:flex;animation:nc-rise .35s var(--ease) both}
.nc-explain .nc-ic{width:16px;height:16px;color:var(--accent-text);margin-top:2px}
/* slider */
.nc-slider{display:flex;flex-direction:column;gap:10px}
.nc-slider-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mute)}
.nc-slider-top output{font-size:15px;color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.nc-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:50%}
.nc-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--app,var(--accent)) 0 var(--p),var(--line2) var(--p) 100%)}
.nc-range::-moz-range-track{height:6px;border-radius:999px;background:var(--line2)}
.nc-range::-moz-range-progress{height:6px;border-radius:999px;background:var(--app,var(--accent))}
.nc-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);transition:transform .15s}
.nc-range::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.nc-range:active::-webkit-slider-thumb{transform:scale(1.12)}
.nc-range:focus-visible{box-shadow:none}
.nc-range:focus-visible::-webkit-slider-thumb{box-shadow:var(--focus)}
.nc-range-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:-4px}
.nc-answerbox{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line)}
.nc-answerbox .nc-stat-num{font-size:38px;transition:color .3s}
.nc-answerbox.is-hard .nc-stat-num{color:var(--warn)}
.nc-answerbox.is-easy .nc-stat-num{color:var(--ok)}
/* flip card */
.nc-flip{perspective:1200px;border:0;background:none;padding:0;width:100%;display:block;text-align:center;color:var(--text)}
.nc-flip-in{position:relative;display:grid;min-height:168px;transition:transform .6s var(--ease);transform-style:preserve-3d}
.nc-flip.is-flipped .nc-flip-in{transform:rotateY(180deg)}
.nc-flip-face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px 24px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--inset2),var(--inset));backface-visibility:hidden;-webkit-backface-visibility:hidden}
.nc-flip-face small{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:650}
.nc-flip-face b{font-size:20px;font-weight:640;letter-spacing:-.015em;line-height:1.35}
.nc-flip-face span{font-size:14.5px;color:var(--t2);line-height:1.55;max-width:48ch}
.nc-flip-back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--accent-soft),var(--inset))}
.nc-flip-face .nc-flip-hint{font-size:12px;color:var(--faint);margin-top:4px}
/* audio / read aloud */
.nc-wave{display:flex;align-items:center;gap:3px;height:40px;flex:1;min-width:0;overflow:hidden}
.nc-wave i{flex:none;width:3px;border-radius:2px;background:var(--line3);height:calc(var(--h) * 1%);transition:background .2s}
.nc-wave i.is-played{background:var(--app,var(--accent))}
.nc-playbtn{width:44px;height:44px;border-radius:50%;flex:none;border:0;display:grid;place-items:center;background:var(--btn-pri-bg);color:var(--btn-pri-fg);transition:transform .12s}
.nc-playbtn:active{transform:scale(.93)}
.nc-playbtn .nc-ic{width:18px;height:18px}
.nc-readline{font-size:15px;line-height:1.7;color:var(--mute)}
.nc-readline mark{background:var(--accent-soft);color:var(--text);border-radius:4px;padding:1px 2px}

/* ---------- 20. Source: quote + page chip ---------- */
.nc-quote{position:relative;margin:0;padding:4px 0 4px 20px;font-size:17px;line-height:1.55;font-weight:500;letter-spacing:-.006em;color:var(--text)}
.nc-quote::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:3px;background:var(--app,var(--accent))}
.nc-quote mark{background:color-mix(in srgb,var(--app,var(--accent)) 22%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.nc-srcbar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 12px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);min-width:0}
.nc-srcbar .nc-appicon{--s:30px;--r:8px}
.nc-srcbar .nc-grow b{display:block;font-size:14px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-srcbar .nc-grow span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-citation{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:15.5px;line-height:1.7;padding:14px 18px 14px 44px;text-indent:-26px;border-radius:var(--r-inner);background:var(--inset);border:1px solid var(--line);color:var(--text)}
.nc-citation i{font-style:italic}
.nc-seg-sm{display:inline-flex;padding:2px;border-radius:999px;background:var(--inset2);border:1px solid var(--line)}
.nc-seg-sm button{border:0;background:transparent;color:var(--mute);height:26px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;transition:all .15s}
.nc-seg-sm button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2),0 0 0 1px var(--line)}

/* ---------- 21. Timer ---------- */
.nc-timer{display:flex;align-items:center;gap:22px}
.nc-timer .nc-ring{--size:124px;--stroke:7px}
.nc-timer .nc-ring-c b{font-size:30px;letter-spacing:-.02em;font-weight:620}
.nc-timer .nc-ring-fg{transition:stroke-dashoffset 1s linear}
.nc-timer-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nc-timer-main b{font-size:17px;font-weight:620;letter-spacing:-.01em}
.nc-timer-dots{display:flex;gap:6px;margin-top:4px}
.nc-timer-dots i{width:22px;height:6px;border-radius:3px;background:var(--line2)}
.nc-timer-dots i.is-done{background:var(--app,var(--accent))}
.nc-timer-dots i.is-now{background:linear-gradient(90deg,var(--app,var(--accent)) 50%,var(--line2) 50%)}
.nc-card[data-status="paused"] .nc-ring-c b{animation:nc-blink 1.4s steps(1) infinite}

/* ---------- 22. Memory ---------- */
.nc-memory{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-inner);background:linear-gradient(135deg,var(--accent-soft),transparent 80%);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.nc-memory>.nc-ic{width:18px;height:18px;color:var(--accent-text);margin-top:3px}
.nc-memory-text{font-size:15.5px;line-height:1.5;font-weight:520;margin:0}
.nc-memory-text s{color:var(--mute);text-decoration-color:var(--del)}
.nc-memory-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:12.5px;color:var(--mute)}
.nc-memory-meta span{display:inline-flex;align-items:center;gap:5px}
.nc-memory-meta .nc-ic{width:13px;height:13px}
.nc-card.is-forgotten .nc-memory{opacity:.5;filter:grayscale(1)}
.nc-card.is-forgotten .nc-memory-text{text-decoration:line-through}

/* ---------- 23. Connect / sign in ---------- */
.nc-connect{display:flex;align-items:center;justify-content:center;gap:0;padding:18px 0 6px}
.nc-connect .nc-appicon{--s:52px;--r:14px}
.nc-connect .nc-appicon .nc-ic{width:26px;height:26px}
.nc-connect-link{position:relative;width:120px;height:2px;margin:0 6px;background-image:linear-gradient(90deg,var(--line3) 50%,transparent 50%);background-size:8px 2px}
.nc-connect-link b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--del);color:var(--del)}
.nc-connect-link b .nc-ic{width:13px;height:13px;stroke-width:2.6}
.nc-card[data-status="done"] .nc-connect-link{background-image:linear-gradient(90deg,var(--ok),var(--ok));background-size:100% 2px}
.nc-card[data-status="done"] .nc-connect-link b{border-color:var(--ok);color:var(--ok)}
.nc-connect-link .nc-when-ok{display:none}
.nc-card[data-status="done"] .nc-connect-link .nc-when-off{display:none}
.nc-card[data-status="done"] .nc-connect-link .nc-when-ok{display:block}
.nc-connect-caption{text-align:center;font-size:14.5px;color:var(--t2);line-height:1.55;margin:0}
.nc-connect-caption small{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
.nc-affects{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* ---------- 24. Undo toast ---------- */
.nc-toast-wrap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.nc-toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--btn-pri-bg);color:var(--btn-pri-fg);font-size:14px;font-weight:500;box-shadow:0 10px 34px rgba(0,0,0,.35);animation:nc-toast-in .35s var(--ease-spring) both}
.nc-toast .nc-ic{width:15px;height:15px}
.nc-toast button{border:0;height:30px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--btn-pri-fg) 12%,transparent);color:inherit;font-size:13.5px;font-weight:650}
.nc-toast.is-out{animation:nc-toast-out .25s var(--ease) both}
/* inline toast variant for static mockups */
.nc-toast--inline{align-self:center;margin-top:18px!important;animation:none}

/* Dismissed card (Skip / Discard / Dismiss): slim row */
.nc-card.is-dismissed .nc-card-bd,.nc-card.is-dismissed .nc-actions,.nc-card.is-dismissed .nc-card-ft,.nc-card.is-dismissed .nc-fold{display:none}
.nc-card.is-dismissed .nc-card-hd{border-bottom:0;min-height:0;padding:11px 18px}
.nc-card.is-dismissed .nc-card-ttl b{color:var(--mute);font-weight:520}
.nc-card.is-dismissed .nc-appicon{filter:grayscale(1);opacity:.55;--s:26px;--r:7px}
.nc-card.is-dismissed .nc-appicon .nc-ic{width:14px;height:14px}
.nc-card.is-dismissed{background:transparent;box-shadow:none;border-style:dashed}

/* ---------- 25. Motion ---------- */
@keyframes nc-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nc-rot{to{transform:rotate(360deg)}}
@keyframes nc-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes nc-dash100{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes nc-dash{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes nc-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes nc-scan{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes nc-sheen{from{background-position:130% 0}to{background-position:-30% 0}}
@keyframes nc-shimmer-text{from{background-position:120% 0}to{background-position:-20% 0}}
@keyframes nc-caret{50%{opacity:0}}
@keyframes nc-blink{50%{opacity:.35}}
@keyframes nc-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
@keyframes nc-pulse-ok{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
@keyframes nc-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes nc-toast-in{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes nc-toast-out{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes nc-pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* entrance: kit.js adds .nc-enter to chat children with a stagger (--d) */
.nc-enter{animation:nc-rise .46s var(--ease) both;animation-delay:var(--d,0ms)}
.nc-swap{animation:nc-rise .32s var(--ease) both}
.nc-pop{animation:nc-pop .35s var(--ease-spring) both}

@media (prefers-reduced-motion:reduce){
  :where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt),:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *,:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *::before,:where(.nc-card,.nc-stack,.nc-chat,.nc-gallery,.nc-toast-wrap,.nc-activity,.nc-thinking,.nc-receipt) *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .nc-card[data-status="working"]::before,.nc-card[data-status="working"] .nc-card-hd::after{display:none}
  .nc-spin{animation:nc-rot 1.6s linear infinite!important;animation-duration:1.6s!important;animation-iteration-count:infinite!important}
}

/* ---------- 26. Side panel width (≤480px column) ---------- */
@container chat (max-width:480px){
  .nc-card-hd{padding:12px 14px;gap:10px;min-height:58px}
  .nc-card-bd{padding:14px 14px 16px}
  .nc-actions,.nc-after{padding:0 14px 14px;gap:6px}
  .nc-card-ft{padding:10px 14px}
  .nc-appicon{--s:30px;--r:8px}
  .nc-card-ttl b{font-size:14.5px}
  .nc-card-ttl span{font-size:12.5px}
  .nc-status{font-size:13px}
  .nc-btn{height:34px;padding:0 14px;font-size:13.5px}
  .nc-btn--sm{height:30px;padding:0 12px;font-size:12.5px}
  .nc-text,.nc-coach,.nc-user,.nc-mail-body{font-size:14px}
  .nc-activity{font-size:14px}
  .nc-user{max-width:88%}
  .nc-week{gap:2px}
  .nc-day{padding:8px 0 9px;border-radius:10px}
  .nc-day-name{font-size:11.5px}
  .nc-day-num{font-size:16px}
  .nc-event{gap:12px;padding:11px 12px 11px 16px}
  .nc-event-main b{font-size:14.5px}
  .nc-event-main span{font-size:12.5px;white-space:normal}
  .nc-event .nc-avatars{display:none}
  .nc-date b{font-size:20px}
  .nc-mail-grid{gap:4px 14px;font-size:13.5px}
  .nc-tile{flex-direction:column;align-items:stretch;gap:14px}
  .nc-thumb{width:100%;aspect-ratio:16/7}
  .nc-thumb--doc{width:100%;aspect-ratio:16/8}
  .nc-tile:has(.nc-thumb--sm){flex-direction:row;align-items:center}
  .nc-thumb--sm,.nc-thumb--doc.nc-thumb--sm{width:76px;aspect-ratio:3/3.6}
  .nc-tile-title{font-size:18px}
  .nc-stat-num{font-size:38px}
  .nc-bar{grid-template-columns:86px 1fr auto;gap:10px;font-size:12.5px}
  .nc-timer{gap:16px}
  .nc-timer .nc-ring{--size:100px}
  .nc-timer .nc-ring-c b{font-size:24px}
  .nc-quote{font-size:15.5px;padding-left:16px}
  .nc-vs{grid-template-columns:1fr;gap:6px}
  .nc-vs-mid{display:none}
  .nc-check{padding:11px 12px;gap:12px}
  .nc-check-when{font-size:12px}
  .nc-option{padding:12px 13px;gap:12px}
  .nc-option-side{display:none}
  .nc-diff-row{padding-left:40px;padding-right:12px;font-size:14px}
  .nc-diff-row::before{left:12px}
  .nc-connect-link{width:70px}
  .nc-datechange{gap:10px}
  .nc-datebox{min-width:72px;padding:8px 10px}
  .nc-hide-narrow{display:none!important}
  .nc-li-side{font-size:12px}
  .nc-receipt{font-size:13.5px;padding:8px 14px}
  .nc-flip-face b{font-size:17.5px}
  .nc-statgrid{grid-template-columns:repeat(2,1fr)}
}
@container chat (min-width:481px){ .nc-show-narrow{display:none!important} }

/* ---------- 27. Kit/gallery helpers (page chrome, not used inside cards) ---------- */
.nc-demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.nc-demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nc-demo-label{font-size:12px;color:var(--faint);margin:0 0 8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ==========================================================================
   27. Shared parts folded in from the area pages during the final review
   (were page-local nc-x-*; see SPEC.md §9). Use these instead of copying.
   ========================================================================== */
/* 27a. Card parts (folded in from area pages A) */
.nc-disclose{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .38s var(--ease),opacity .3s,visibility 0s .38s}
.nc-disclose>.nc-disclose-in{min-height:0;overflow:hidden}
.nc-disclose.is-open{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.nc-disclose.is-open>.nc-disclose-in{padding-top:14px}
.nc-pane[hidden]{display:none}
.nc-pane{animation:nc-rise .3s var(--ease) both}
.nc-segbar{display:flex;gap:3px;height:10px;border-radius:999px;overflow:hidden}
.nc-segbar i{display:block;height:100%;flex:var(--w) 1 0;background:color-mix(in srgb,var(--app,var(--accent)) calc(var(--o,100) * 1%),transparent);min-width:6px}
.nc-segbar i.is-est{background:repeating-linear-gradient(135deg,var(--app,var(--accent)) 0 4px,color-mix(in srgb,var(--app,var(--accent)) 50%,transparent) 4px 8px)}
.nc-seglegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:8px}
.nc-seglegend span{display:inline-flex;align-items:center;gap:6px}
.nc-seglegend i{width:9px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--app,var(--accent)) calc(var(--o,100) * 1%),transparent)}
.nc-tight{padding-top:0!important;padding-bottom:0!important;flex-direction:row!important;align-items:center;justify-content:flex-start!important;gap:8px}
.nc-tight small{display:inline!important;margin:0!important}
.nc-overline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.nc-mono-sm{font-family:var(--mono);font-size:13px;color:var(--t2)}
.nc-pillrow{display:flex;flex-wrap:wrap;gap:6px}
.nc-tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--t2);line-height:1.5}
.nc-tip .nc-ic{width:16px;height:16px;margin-top:2px;color:var(--accent-text)}
.nc-tip b{color:var(--text);font-weight:600}
.nc-bigrow{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.nc-stat-l{font-size:13px;color:var(--mute)}
.nc-day-sub{font-size:11px;line-height:1.2;color:var(--mute);margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nc-day[aria-selected="true"] .nc-day-sub{color:var(--t2)}
.nc-after-msg{flex:1 1 150px;min-width:0}
.nc-after-msg b{color:var(--t2);font-weight:560}
.nc-stat3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@container chat (max-width:480px){
  .nc-bigrow{gap:14px}
  .nc-stat3 .nc-mini{padding:10px 10px}
  .nc-stat3 .nc-mini b{font-size:19px}
}
/* 27b. Page parts (folded in from area pages B) */
.nc-toc{max-width:var(--nc-col,720px);margin:0 auto 46px;display:flex;flex-wrap:wrap;gap:6px}
.nc-toc a{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line2);color:var(--t2);text-decoration:none;font-size:13px;transition:background .15s,border-color .15s}
.nc-toc a:hover{background:var(--inset2);border-color:var(--line3);color:var(--text)}
.nc-toc a i{font-style:normal;font-size:11px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
.nc-toc a s{text-decoration:none;color:#f5c451;font-size:11px}
html[data-theme="light"] .nc-toc a s{color:#8a5a00}
.nc-vstack{display:flex;flex-direction:column;gap:10px}
.nc-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc-num{font-variant-numeric:tabular-nums}
.nc-rule{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12.5px}
.nc-rule::before,.nc-rule::after{content:"";flex:1;height:1px;background:var(--line)}
.nc-input{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--inset);transition:border-color .15s,box-shadow .15s}
.nc-input:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.nc-input input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14.5px;color:var(--text)}
.nc-input input::placeholder{color:var(--faint)}
.nc-input button{width:32px;height:32px;border-radius:50%;border:0;background:var(--btn-pri-bg);color:var(--btn-pri-fg);display:grid;place-items:center;flex:none;transition:transform .12s}
.nc-input button:active{transform:scale(.92)}
@container chat (max-width:480px){.nc-split{grid-template-columns:1fr}}
/* 27c. Person row (big avatar + name + role), folded from calendar/classes */
.nc-who{display:flex;align-items:center;gap:14px;min-width:0}
.nc-who-main{min-width:0;flex:1}
.nc-who-main b{display:block;font-size:17px;font-weight:640;letter-spacing:-.01em;line-height:1.3}
.nc-who-main span{display:block;font-size:13.5px;color:var(--mute)}
@container chat (max-width:480px){.nc-who .nc-av--lg{width:38px;height:38px;font-size:13px}}

/* 27d. Review fixes (final polish pass) */
/* Live runs: a step's result line and time appear only once it finishes */
.nc-step-time,.nc-step-main small{transition:opacity .3s var(--ease)}
.nc-card[data-nc-run] .nc-step:is([data-state="todo"],[data-state="active"]) .nc-step-time,
.nc-card[data-nc-run] .nc-step:is([data-state="todo"],[data-state="active"]) .nc-step-main small{opacity:0}
/* Warn / failed steps: one centred glyph, never a stacked icon + glyph */
.nc-step:is([data-state="warn"],[data-state="failed"]) .nc-step-ic .nc-ic{display:none}
.nc-step:is([data-state="warn"],[data-state="failed"]) .nc-step-ic::after{position:absolute;inset:0;display:grid;place-items:center}
/* Softer working sheen (was reading as a grey band on long cards) */
.nc-card[data-status="working"]::before{background:linear-gradient(105deg,transparent 42%,color-mix(in srgb,var(--text) 2.2%,transparent) 50%,transparent 58%);background-size:250% 100%}
/* Avatars: two-letter initials fit inside the circle */
.nc-av{font-size:10.5px;letter-spacing:-.02em}
/* Disabled buttons stay readable in both themes */
.nc-btn[disabled],.nc-btn[aria-disabled="true"]{opacity:.5}
/* Source lines: label never breaks; the source name may use two lines instead of being cut off */
.nc-src>span:not([class]){white-space:nowrap;flex:none}
.nc-src b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0;line-height:1.35}
/* Timeline: blocks sit above the hour lines; fixed blocks are opaque so lines don't show through */
.nc-tl-block{z-index:1}
.nc-tl-block.is-fixed{background:color-mix(in srgb,var(--text) 7%,var(--card))}
/* Sparkline end dot as HTML, so it stays round when the SVG stretches (see SPEC.md §9) */
.nc-spark-wrap{position:relative}
.nc-spark-hdot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--app,var(--accent));box-shadow:0 0 0 2.5px var(--card);transform:translate(-50%,-50%)}
/* Sparklines stretch horizontally: keep line weight even, and reveal with a left-to-right wipe
   (a dash-draw breaks into segments once strokes are non-scaling) */
.nc-spark line,.nc-spark path{vector-effect:non-scaling-stroke}
.nc-spark .nc-spark-line{stroke-dasharray:none;animation:none}
.nc-spark{animation:nc-wipe 1.2s var(--ease) both}
@keyframes nc-wipe{from{clip-path:inset(-12px 100% -12px -12px)}to{clip-path:inset(-12px -12px -12px -12px)}}
@media (prefers-reduced-motion:reduce){.nc-spark{animation:none}}
/* Action cards: app-only additions around the ported kit (action-cards.css). */

/* A message's cards. The container query makes cards use their side-panel
   layout whenever the chat column is 480px or narrower. */
.nc-stack{display:flex;flex-direction:column;gap:14px;margin:14px 0 6px;container-type:inline-size;container-name:chat;min-width:0}
.nc-stack>.nc-activity{margin:8px 0 -4px!important}
.nc-stack>.nc-receipt{align-self:center;margin-top:6px!important}

/* A card that couldn't be drawn falls back to its plain text. */
.nc-card-fallback{margin:10px 0;padding:10px 14px;border:1px dashed var(--line2);border-radius:12px;color:var(--t2);font-size:14px;line-height:1.5;white-space:pre-line}

/* Activity rows that open something are buttons. */
.nc-activity--btn{background:none;border:0;padding:2px 6px 2px 1px;margin-left:-1px;border-radius:8px;cursor:pointer;text-align:left;font:inherit;width:fit-content;max-width:100%}
.nc-activity--btn:hover{color:var(--t2);background:var(--inset2)}
.nc-activity--btn:hover b{color:var(--text)}
.nc-activity>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-activity u{text-decoration:none;font-weight:620;color:var(--t2)}
.cx-acts{display:flex;flex-direction:column;gap:2px;margin:4px 0 10px}
.cx-acts .nc-activity{margin:0!important;font-size:14px}
.cx-acts .nc-activity .nc-ic{width:15px;height:15px}

/* Thinking panel and live activity inside a streaming answer. */
.cx-msg .nc-thinking,.northstar-assistant-messages .nc-thinking{margin:6px 0 10px;font:14.5px/1.5 var(--font)}
.cx-msg .nc-activity{font-family:var(--font)}

/* The toast sits above the composer. */
.nc-toast-wrap{bottom:96px}

/* Card gallery page (#cards). */
.nc-gallery{--nc-col:720px;padding:28px 28px 60px;overflow:auto;height:100%;color:var(--text);font:15px/1.55 var(--font)}
.nc-gallery[data-width="400"]{--nc-col:400px}
.nc-gallery .nc-section{margin-bottom:48px}
.nc-gallery-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:var(--nc-col);margin:0 auto 26px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.nc-gallery-bar .nc-seg-sm{margin-right:4px}
.nc-gallery-bar .nc-meta{margin-left:auto}
